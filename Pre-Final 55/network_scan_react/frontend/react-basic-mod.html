<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Network Scan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

        const API_BASE_URL = "http://127.0.0.1:5000";

        function getProtocolColor(protocol) {
            switch ((protocol || "").toUpperCase()) {

                case "TCP":
                    return "#1565C0";

                case "UDP":
                    return "#C2185B";

                case "ICMP":
                    return "#EF6C00";

                case "ARP":
                    return "#7B1FA2";

                case "HTTP":
                    return "#5D4037";

                case "HTTPS":
                    return "#00838F";

                case "DNS":
                    return "#AFB42B";

                default:
                    return "#455A64";
            }
        }

        /*COMMON INLINE STYLES*/
        const styles = {

            analysisSectionHeader: {
                color: "#FFFFFF",
                fontWeight: "700",
                fontSize: "18px",
                textAlign: "center",
                padding: "10px"
            },

            modalHeader: {
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center"
            },

            modalFooter: {
                display: "flex",
                justifyContent: "flex-end",
                marginTop: "20px"
            },

            closeButton: {
                border: "none",
                background: "none",
                cursor: "pointer",
                fontWeight: "bold",
                fontSize: "18px"
            },

            centerMessage: {
                textAlign: "center",
                padding: "30px",
                color: "#666",
                fontWeight: "600"
            },

            tableFullWidth: {
                width: "100%",
                borderCollapse: "collapse"
            },

            contextMenuItem: {
                padding: "10px",
                cursor: "pointer",
                transition: "0.2s",
            },

            summaryCard: {
                background: "#FFFFFF",
                border: "1px solid #DDDDDD",
                borderRadius: "8px",
                padding: "18px",
                textAlign: "center",
                boxShadow: "0 2px 6px rgba(0,0,0,0.08)"
            },

            summaryTitle: {
                fontSize: "14px",
                color: "#666666",
                marginBottom: "10px",
                fontWeight: "600"
            },

            summaryValue: {
                fontSize: "24px",
                fontWeight: "700",
                color: "#556B2F"
            },

            sectionTitle: {

                fontSize: "20px",
                fontWeight: "700",
                marginBottom: "15px",
                color: "#556B2F"

            },

            infoTable: {

                width: "100%",
                borderCollapse: "collapse",
                marginBottom: "25px"

            },

            infoLabel: {

                width: "22%",
                fontWeight: "600",
                padding: "6px 10px 6px 0",
                verticalAlign: "top",
                color: "#333333"

            },

            infoValue: {

                width: "28%",
                padding: "6px 15px",
                verticalAlign: "top",
                color: "#222222",
                whiteSpace: "nowrap"

            },

            tableHeaderCell: {

                background: "#556B2F",
                color: "#FFFFFF",
                padding: "8px 10px",
                fontWeight: "700",
                border: "1px solid #556B2F",
                fontSize: "14px"

            },

            tableCell: {

                padding: "7px 10px",
                border: "1px solid #EEEEEE",
                fontSize: "14px",
                verticalAlign: "middle"

            }

        };

        const PacketTable = React.memo(function PacketTable({

            filteredPackets,
            selectedPacket,
            setSelectedPacket,
            setSelectedWSPacket,
            setPacketAIResult,
            setPacketAIError,
            setPacketAILoading

        }) {

            return (

                <table className="device-table">
                    <thead className="table-header">
                        <tr>
                            <th>Sl.</th>
                            <th>Time</th>
                            <th>Pkt. ID</th>
                            <th>Interface</th>
                            <th>Source</th>
                            <th>S-Port</th>
                            <th>Destination</th>
                            <th>D-Port</th>
                            <th>Protocol</th>
                            <th>Length</th>
                            <th>Risk</th>
                            <th>Flags</th>
                            <th>Info</th>
                        </tr>
                    </thead>
                    <tbody>

                        {filteredPackets.map((packet, index) => (
                            <tr
                                key={`${packet.id}-${index}`}
                                onClick={() => {
                                    setSelectedPacket(packet);
                                    setSelectedWSPacket(packet);
                                    setPacketAIResult(null);
                                    setPacketAIError("");
                                    setPacketAILoading(false);
                                }}
                                style={{
                                    cursor: "pointer",
                                    backgroundColor:
                                        selectedPacket === packet
                                            ? "#dbeafe"
                                            : "white"
                                }}
                            >

                                <td>{index + 1}</td>
                                <td>{packet.time}</td>
                                <td>{packet.id}</td>
                                <td>{packet.interface}</td>
                                <td>{packet.source}</td>
                                <td>{packet.sourcePort}</td>
                                <td>{packet.destination}</td>
                                <td>{packet.destinationPort}</td>

                                <td
                                    style={{
                                        color: getProtocolColor(packet.protocol),
                                        fontWeight: "bold"
                                    }}
                                >
                                    {packet.protocol}
                                </td>

                                <td>{packet.length}</td>
                                <td style={{ textAlign: "center", verticalAlign: "middle" }}>
                                    <span style={{
                                        display: "inline-block", minWidth: "72px", padding: "4px 12px", borderRadius: "14px", fontSize: "13px", fontWeight: "700",
                                        color: "#FFFFFF",
                                        background:
                                            packet.riskLevel === "Critical"
                                                ? "#C62828"
                                                : packet.riskLevel === "High"
                                                    ? "#EF6C00"
                                                    : packet.riskLevel === "Medium"
                                                        ? "#F9A825"
                                                        : "#43A047"
                                    }}>{packet.riskLevel || "Low"}</span>
                                </td>

                                <td style={{ textAlign: "center", verticalAlign: "middle" }}>
                                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "4px" }}>
                                        <div style={{ width: "100px", height: "12px", fontWeight: "600", background: "#ddd", borderRadius: "8px", overflow: "hidden" }}>
                                            <div style={{
                                                width: `${packet.riskScore || 0}%`, height: "100%", backgroundColor:
                                                    packet.riskScore >= 80 ? "#d32f2f"
                                                        : packet.riskScore >= 60 ? "#f57c00"
                                                            : packet.riskScore >= 40 ? "#F9A825"
                                                                : "#43a047"
                                            }} />
                                        </div>
                                        <span style={{
                                            fontSize: "13px", fontWeight: "700",
                                            color:
                                                packet.riskScore >= 80
                                                    ? "#C62828"
                                                    : packet.riskScore >= 60
                                                        ? "#EF6C00"
                                                        : packet.riskScore >= 40
                                                            ? "#F9A825"
                                                            : "#2E7D32"
                                        }}>{packet.riskScore || 0}/100</span>
                                    </div>
                                </td>
                                <td>{packet.info}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            );
        });

        const DeviceTable = React.memo(function DeviceTable({

            sortedDevices,
            handleView,
            scanning,
            refreshing

        }) {

            return (
                <tbody>
                    {sortedDevices.map((device, index) => (
                        <tr key={`${device.ip}-${device.mac}-${device.endpointId}`}>
                            <td>{index + 1}</td>
                            <td
                                style={{
                                    fontWeight: "bold",
                                    color: "#6B5E00"
                                }}
                            >
                                {device.endpointId || "-"}
                            </td>
                            <td>{device.hostname || "-"}</td>
                            <td>{device.manufacturer || "-"}</td>
                            <td>{device.model || "-"}</td>
                            <td>{device.operatingSystem || "-"}</td>
                            <td>{device.ip || "-"}</td>
                            <td>{device.mac || "-"}</td>
                            <td style={{ textAlign: "center", whiteSpace: "nowrap", fontSize: "18px" }}>
                                <span title="HTTP/HTTPS">{device.httpBannerDetected ? "🌐 " : ""}</span>
                                <span title="HTTPS">{device.httpScheme === "HTTPS" ? "🔒 " : ""}</span>
                                <span title="SNMP">{device.snmpEnabled ? "📡 " : ""}</span>
                                <span title="LLDP">{device.lldpSystemName ? "🔗 " : ""}</span>
                                <span title="CDP">{device.cdpDeviceId ? "🖧 " : ""}</span>
                                <span title="UPnP">{(device.discoverySource || "").includes("UPnP") ? "📺 " : ""}</span>
                                <span title="mDNS">{(device.discoverySource || "").includes("mDNS") ? "📢 " : ""}</span>
                                <span title="NetBIOS">{(device.discoverySource || "").includes("NetBIOS") ? "💻" : ""}</span>
                                <span title="SSH">{device.sshBannerDetected ? "🔑 " : ""}</span>
                            </td>
                            <td style={{ textAlign: "center" }}>
                                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" }}>
                                    <div style={{ width: "70px", height: "10px", background: "#DDD", borderRadius: "8px", overflow: "hidden" }}>
                                        <div style={{
                                            width: `${device.deviceRiskScore || 0}%`, height: "100%", background:
                                                device.deviceRiskScore >= 80 ? "#C62828"
                                                    : device.deviceRiskScore >= 60 ? "#EF6C00"
                                                        : device.deviceRiskScore >= 40 ? "#F9A825"
                                                            : "#43A047"
                                        }} />
                                    </div>
                                    <span style={{ fontSize: "12px", fontWeight: "700" }}>{device.deviceRiskScore || 0}/100</span>
                                </div>
                            </td>
                            <td>{device.responseTime || "-"}</td>
                            <td
                                style={{
                                    padding: "4px 18px",
                                    textAlign: "left",
                                    color: device.active
                                        ? "#008000"
                                        : "#C00000",
                                    fontWeight: "bold"
                                }}
                            >
                                {device.active
                                    ? "Online"
                                    : "Offline"}
                            </td>
                            <td
                                style={{
                                    padding: "8px",
                                    whiteSpace: "nowrap"
                                }}
                            >
                                <button
                                    className="btn"
                                    onClick={() => handleView(device)}
                                    disabled={scanning || refreshing}
                                >
                                    👁 View
                                </button>
                            </td>
                        </tr>
                    ))}
                </tbody>
            );
        });

        const HeaderClock = React.memo(function HeaderClock({ currentDateTime }) {
            return (
                <p className="datetime">Date & Time : {currentDateTime}</p>
            );
        });

        const HorizontalBarChart = React.memo(function HorizontalBarChart({

            data

        }) {

            const chartData = Array.isArray(data)
                ? data
                : [];

            if (chartData.length === 0) {

                return (
                    <div style={styles.centerMessage}>
                        No statistics available
                    </div>
                );

            }

            const maxValue = Math.max(
                ...chartData.map(item => item?.count || 0),
                1
            );

            return (

                <div>

                    {chartData.map((item, index) => (

                        <div
                            key={`${item.name}-${item.count}`}
                            style={{
                                display: "flex",
                                alignItems: "center",
                                marginBottom: "12px"
                            }}
                        >

                            <div
                                style={{
                                    width: "260px",
                                    fontWeight: "600"
                                }}
                            >
                                <div
                                    title={item.name}
                                    style={{
                                        wordBreak: "break-word",
                                        lineHeight: "16px",
                                        fontSize: "13px"
                                    }}
                                >
                                    {item.name}
                                </div>
                            </div>

                            <div
                                style={{
                                    flex: 1,
                                    minWidth: "180px",
                                    background: "#E5E5E5",
                                    height: "24px",
                                    borderRadius: "5px",
                                    overflow: "hidden"
                                }}
                            >

                                <div
                                    style={{
                                        width: `${(item.count / maxValue) * 100}%`,
                                        background: "#556B2F",
                                        height: "100%"
                                    }}
                                />

                            </div>

                            <div
                                style={{
                                    width: "50px",
                                    textAlign: "right",
                                    fontWeight: "700",
                                    marginLeft: "10px"
                                }}
                            >
                                {item.count}
                            </div>
                        </div>
                    ))}
                </div>
            );
        });

        const VerticalBarChart = React.memo(function VerticalBarChart({
            data
        }) {

            const chartData = Array.isArray(data)
                ? data
                    .map(item => ({
                        name: item?.name ?? "Unknown",
                        count: Number(item?.count || 0)
                    }))
                    .filter(item => item.count >= 0)
                : [];

            if (chartData.length === 0) {
                return (
                    <div style={styles.centerMessage}>
                        No statistics available
                    </div>
                );
            }

            const maxValue = Math.max(
                ...chartData.map(item => item.count),
                1
            );

            return (
                <div
                    style={{
                        display: "flex",
                        alignItems: "flex-end",
                        gap: "12px",
                        height: "320px",
                        padding: "20px 10px 50px 10px",
                        overflowX: "auto"
                    }}
                >

                    {chartData.map((item, index) => {

                        const height =
                            (item.count / maxValue) * 240;

                        return (
                            <div
                                key={`${item.name}-${index}`}
                                title={`${item.name}: ${item.count}`}
                                style={{
                                    minWidth: "55px",
                                    height: "270px",
                                    display: "flex",
                                    flexDirection: "column",
                                    justifyContent: "flex-end",
                                    alignItems: "center"
                                }}
                            >

                                <div
                                    style={{
                                        fontWeight: "700",
                                        fontSize: "12px",
                                        marginBottom: "5px"
                                    }}
                                >
                                    {item.count}
                                </div>

                                <div
                                    style={{
                                        width: "42px",
                                        height: `${Math.max(height, 2)}px`,
                                        background: "#556B2F",
                                        borderRadius: "5px 5px 0 0"
                                    }}
                                />

                                <div
                                    style={{
                                        marginTop: "8px",
                                        fontSize: "11px",
                                        textAlign: "center",
                                        width: "70px",
                                        wordBreak: "break-word"
                                    }}
                                >
                                    {item.name}
                                </div>

                            </div>
                        );
                    })}

                </div>
            );
        });

        const PieChart = React.memo(function PieChart({
            data
        }) {

            const chartData = Array.isArray(data)
                ? data
                    .map(item => ({
                        name: item?.name ?? "Unknown",
                        count: Number(item?.count || 0)
                    }))
                    .filter(item => item.count > 0)
                : [];

            if (chartData.length === 0) {
                return (
                    <div style={styles.centerMessage}>
                        No statistics available
                    </div>
                );
            }

            const total = chartData.reduce(
                (sum, item) => sum + item.count,
                0
            );

            const pieColors = [
                "#556B2F",
                "#7B1FA2",
                "#1565C0",
                "#EF6C00",
                "#00897B",
                "#C62828",
                "#6D4C41",
                "#3949AB",
                "#2E7D32",
                "#F9A825"
            ];

            let current = 0;

            const segments = chartData.map((item, index) => {

                const start = current;

                const percentage =
                    (item.count / total) * 100;

                current += percentage;

                return {
                    ...item,
                    start,
                    end: current,
                    percentage,
                    color: pieColors[index % pieColors.length]
                };
            });

            const gradient = segments
                .map(segment =>
                    `${segment.color} ${segment.start}% ${segment.end}%`
                )
                .join(", ");

            return (
                <div
                    style={{
                        display: "flex",
                        gap: "35px",
                        alignItems: "center",
                        justifyContent: "center",
                        flexWrap: "wrap",
                        padding: "20px"
                    }}
                >

                    <div
                        style={{
                            width: "260px",
                            height: "260px",
                            borderRadius: "50%",
                            background: `conic-gradient(${gradient})`,
                            position: "relative"
                        }}
                        title={`Total: ${total}`}
                    >

                        <div
                            style={{
                                position: "absolute",
                                width: "110px",
                                height: "110px",
                                borderRadius: "50%",
                                background: "#FFFFFF",
                                top: "75px",
                                left: "75px",
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                fontWeight: "700",
                                fontSize: "20px"
                            }}
                        >
                            {total}
                        </div>

                    </div>

                    <div>

                        {segments.map((item, index) => (

                            <div
                                key={`${item.name}-${index}`}
                                style={{
                                    display: "flex",
                                    alignItems: "center",
                                    marginBottom: "9px",
                                    fontSize: "13px"
                                }}
                                title={`${item.name}: ${item.count}`}
                            >

                                <span
                                    style={{
                                        width: "13px",
                                        height: "13px",
                                        borderRadius: "50%",
                                        background: item.color,
                                        display: "inline-block",
                                        marginRight: "8px"
                                    }}
                                />

                                <span
                                    style={{
                                        minWidth: "150px"
                                    }}
                                >
                                    {item.name}
                                </span>

                                <b>
                                    {item.count}
                                </b>

                                <span
                                    style={{
                                        marginLeft: "8px"
                                    }}
                                >
                                    ({item.percentage.toFixed(1)}%)
                                </span>

                            </div>

                        ))}

                    </div>

                </div>
            );
        });

        const LineChart = React.memo(function LineChart({
            data,
            fixedMax = null,
            valueSuffix = ""
        }) {

            const chartData = Array.isArray(data)
                ? data
                    .map(item => ({
                        name: item?.name ?? "Unknown",
                        count: Number(item?.count || 0)
                    }))
                    .filter(item => Number.isFinite(item.count))
                : [];

            if (chartData.length === 0) {
                return (
                    <div style={styles.centerMessage}>
                        No statistics available
                    </div>
                );
            }

            const width = 760;
            const height = 300;

            const paddingLeft = 55;
            const paddingRight = 20;
            const paddingTop = 25;
            const paddingBottom = 55;

            const plotWidth =
                width - paddingLeft - paddingRight;

            const plotHeight =
                height - paddingTop - paddingBottom;

            const maxValue = Number.isFinite(fixedMax) && fixedMax > 0
                ? fixedMax
                : Math.max(...chartData.map(item => item.count), 1);

            const points = chartData.map((item, index) => {

                const x =
                    chartData.length === 1
                        ? paddingLeft + plotWidth / 2
                        : paddingLeft +
                        (index / (chartData.length - 1)) *
                        plotWidth;

                const y =
                    paddingTop +
                    plotHeight -
                    (item.count / maxValue) * plotHeight;

                return {
                    ...item,
                    x,
                    y
                };
            });

            const path = points
                .map((point, index) =>
                    `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
                )
                .join(" ");

            return (
                <div
                    style={{
                        width: "100%",
                        overflowX: "auto",
                        padding: "10px"
                    }}
                >

                    <svg
                        width={width}
                        height={height}
                        viewBox={`0 0 ${width} ${height}`}
                    >

                        <line
                            x1={paddingLeft}
                            y1={paddingTop}
                            x2={paddingLeft}
                            y2={height - paddingBottom}
                            stroke="#999"
                            strokeWidth="1"
                        />

                        <line
                            x1={paddingLeft}
                            y1={height - paddingBottom}
                            x2={width - paddingRight}
                            y2={height - paddingBottom}
                            stroke="#999"
                            strokeWidth="1"
                        />

                        <path
                            d={path}
                            fill="none"
                            stroke="#556B2F"
                            strokeWidth="3"
                        />

                        {points.map((point, index) => (

                            <g key={`${point.name}-${index}`}>

                                <circle
                                    cx={point.x}
                                    cy={point.y}
                                    r="5"
                                    fill="#556B2F"
                                >
                                    <title>
                                        {point.name}: {point.count}{valueSuffix}
                                    </title>
                                </circle>

                                <text
                                    x={point.x}
                                    y={height - 30}
                                    textAnchor="middle"
                                    fontSize="11"
                                >
                                    {point.name}
                                </text>

                                <text
                                    x={point.x}
                                    y={point.y - 10}
                                    textAnchor="middle"
                                    fontSize="11"
                                    fontWeight="700"
                                >
                                    {point.count}{valueSuffix}
                                </text>

                            </g>

                        ))}

                    </svg>

                </div>
            );
        });

        const ChartModal = React.memo(function ChartModal({
            show,
            title,
            data,
            onClose
        }) {

            const [chartType, setChartType] =
                React.useState("bar");

            React.useEffect(() => {

                if (show) {
                    setChartType("bar");
                }

            }, [show, title]);

            if (!show) {
                return null;
            }

            const renderChart = () => {

                if (chartType === "pie") {

                    return (
                        <PieChart
                            data={data}
                        />
                    );
                }

                if (chartType === "line") {

                    return (
                        <LineChart
                            data={data}
                        />
                    );
                }

                if (chartType === "column") {

                    return (
                        <VerticalBarChart
                            data={data}
                        />
                    );
                }

                return (
                    <HorizontalBarChart
                        data={data}
                    />
                );
            };

            return (
                <div
                    className="modal-overlay"
                    style={{
                        position: "fixed",
                        inset: 0,
                        zIndex: 30000
                    }}
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "950px",
                            maxWidth: "95%",
                            maxHeight: "85vh",
                            overflowY: "auto"
                        }}
                        onClick={(e) =>
                            e.stopPropagation()
                        }
                    >

                        <div style={styles.modalHeader}>

                            <h2>
                                {title}
                            </h2>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <div
                            style={{
                                display: "flex",
                                justifyContent: "center",
                                gap: "8px",
                                marginBottom: "15px",
                                flexWrap: "wrap"
                            }}
                        >

                            <button
                                className="btn"
                                onClick={() =>
                                    setChartType("bar")
                                }
                            >
                                Horizontal Bar
                            </button>

                            <button
                                className="btn"
                                onClick={() =>
                                    setChartType("column")
                                }
                            >
                                Vertical Bar
                            </button>

                            <button
                                className="btn"
                                onClick={() =>
                                    setChartType("pie")
                                }
                            >
                                Pie
                            </button>

                            <button
                                className="btn"
                                onClick={() =>
                                    setChartType("line")
                                }
                            >
                                Line
                            </button>

                        </div>

                        <div
                            style={{
                                minHeight: "320px"
                            }}
                        >
                            {renderChart()}
                        </div>

                        <div
                            style={styles.modalFooter}
                        >

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>

                        </div>

                    </div>

                </div>
            );
        });

        const AlertNotification = React.memo(function AlertNotification({
            notification,
            onClose
        }) {

            if (!notification) {
                return null;
            }

            const severity =
                String(notification.severity || "")
                    .toUpperCase();

            const borderColor =
                severity === "CRITICAL"
                    ? "#C62828"
                    : severity === "HIGH"
                        ? "#EF6C00"
                        : "#F9A825";

            return (
                <div
                    style={{
                        position: "absolute",
                        top: "0px",
                        right: "0px",
                        width: "380px",
                        maxWidth: "calc(100% - 20px)",
                        background: "#FFFFFF",
                        border: "1px solid #CCCCCC",
                        borderLeft: `6px solid ${borderColor}`,
                        borderRadius: "8px",
                        boxShadow: "0 6px 20px rgba(0,0,0,0.25)",
                        padding: "14px",
                        zIndex: 20000
                    }}
                >

                    <div
                        style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center"
                        }}
                    >

                        <b>
                            🚨 {notification.title}
                        </b>

                        <button
                            onClick={onClose}
                            style={{
                                border: "none",
                                background: "transparent",
                                cursor: "pointer",
                                fontSize: "18px"
                            }}
                        >
                            ✕
                        </button>

                    </div>

                    <div
                        style={{
                            marginTop: "8px",
                            fontSize: "13px"
                        }}
                    >
                        {notification.message}
                    </div>

                    <div
                        style={{
                            marginTop: "10px",
                            fontSize: "12px",
                            fontWeight: "bold"
                        }}
                    >
                        Risk Level : {notification.riskLevel || "-"}
                        {"   |   "}
                        Risk Score : {notification.riskScore ?? 0}/100
                    </div>

                </div>
            );
        });

        const AlertPanel = React.memo(function AlertPanel({
            alerts,
            alertSeverityFilter,
            setAlertSeverityFilter,
            alertTypeFilter,
            setAlertTypeFilter,
            alertStatusFilter,
            setAlertStatusFilter,
            alertLoading,
            onAcknowledge,
            onViewPacket,
            onClear,
            onClose
        }) {

            const filteredAlerts =
                (alerts || []).filter(alert => {

                    // Severity filter
                    if (
                        alertSeverityFilter &&
                        String(alert.severity).toUpperCase() !==
                        String(alertSeverityFilter).toUpperCase()
                    ) {
                        return false;
                    }

                    // Alert Type filter
                    if (
                        alertTypeFilter &&
                        String(alert.type).toUpperCase() !==
                        String(alertTypeFilter).toUpperCase()
                    ) {
                        return false;
                    }

                    // Acknowledgement Status filter
                    if (
                        alertStatusFilter === "UNACKNOWLEDGED" &&
                        alert.acknowledged
                    ) {
                        return false;
                    }

                    if (
                        alertStatusFilter === "ACKNOWLEDGED" &&
                        !alert.acknowledged
                    ) {
                        return false;
                    }

                    return true;
                });

            const totalAlerts =
                (alerts || []).length;

            const criticalAlerts =
                (alerts || []).filter(
                    alert =>
                        String(alert.severity).toUpperCase() ===
                        "CRITICAL"
                ).length;

            const highAlerts =
                (alerts || []).filter(
                    alert =>
                        String(alert.severity).toUpperCase() ===
                        "HIGH"
                ).length;

            const mediumAlerts =
                (alerts || []).filter(
                    alert =>
                        String(alert.severity).toUpperCase() ===
                        "MEDIUM"
                ).length;

            const unacknowledgedAlerts =
                (alerts || []).filter(
                    alert =>
                        !alert.acknowledged
                ).length;

            return (
                <div
                    className="modal-overlay"
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "900px",
                            maxWidth: "95%",
                            maxHeight: "80vh",
                            overflowY: "auto"
                        }}
                        onClick={(e) =>
                            e.stopPropagation()
                        }
                    >

                        <div
                            style={{
                                display: "flex",
                                justifyContent: "space-between",
                                alignItems: "center"
                            }}
                        >

                            <h2>
                                🚨 Real-Time Alerts
                            </h2>

                            <button
                                onClick={onClear}
                                style={{
                                    marginLeft: "auto",
                                    marginRight: "10px",
                                    padding: "5px 14px",
                                    border: "1px solid #556B2F",
                                    borderRadius: "5px",
                                    background: "#FFFFFF",
                                    color: "#556B2F",
                                    cursor: "pointer",
                                    fontWeight: "600"
                                }}
                            >
                                Clear
                            </button>

                            <button
                                onClick={onClose}
                                style={{
                                    border: "none",
                                    background: "none",
                                    cursor: "pointer",
                                    fontSize: "18px"
                                }}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <div
                            style={{
                                display: "grid",
                                gridTemplateColumns:
                                    "repeat(5, 1fr)",
                                gap: "8px",
                                marginBottom: "15px",
                                textAlign: "center"
                            }}
                        >

                            <div>
                                <b>Total</b>
                                <br />
                                {totalAlerts}
                            </div>

                            <div>
                                <b>Critical</b>
                                <br />
                                {criticalAlerts}
                            </div>

                            <div>
                                <b>High</b>
                                <br />
                                {highAlerts}
                            </div>

                            <div>
                                <b>Medium</b>
                                <br />
                                {mediumAlerts}
                            </div>

                            <div>
                                <b>Unacknowledged</b>
                                <br />
                                {unacknowledgedAlerts}
                            </div>

                        </div>

                        {alertLoading && (
                            <div
                                style={{
                                    padding: "8px",
                                    textAlign: "center",
                                    color: "#666",
                                    fontSize: "12px"
                                }}
                            >
                                Refreshing alerts...
                            </div>
                        )}

                        <div
                            style={{
                                display: "flex",
                                gap: "10px",
                                marginBottom: "15px",
                                flexWrap: "wrap"
                            }}
                        >

                            {/* Severity */}

                            <select
                                value={alertSeverityFilter}
                                onChange={(e) =>
                                    setAlertSeverityFilter(
                                        e.target.value
                                    )
                                }
                            >
                                <option value="">
                                    All Severities
                                </option>

                                <option value="CRITICAL">
                                    Critical
                                </option>

                                <option value="HIGH">
                                    High
                                </option>

                                <option value="MEDIUM">
                                    Medium
                                </option>
                            </select>


                            {/* Alert Type */}

                            <select
                                value={alertTypeFilter}
                                onChange={(e) =>
                                    setAlertTypeFilter(
                                        e.target.value
                                    )
                                }
                            >
                                <option value="">
                                    All Alert Types
                                </option>

                                <option value="CRITICAL_RISK_PACKET">
                                    Critical Risk
                                </option>

                                <option value="HIGH_RISK_PACKET">
                                    High Risk
                                </option>

                                <option value="SUSPICIOUS_PORT">
                                    Suspicious Port
                                </option>

                                <option value="PLAINTEXT_PROTOCOL">
                                    Plain-Text Protocol
                                </option>

                                <option value="HIGH_PACKET_RATE">
                                    High Packet Rate
                                </option>
                            </select>


                            {/* Status */}

                            <select
                                value={alertStatusFilter}
                                onChange={(e) =>
                                    setAlertStatusFilter(
                                        e.target.value
                                    )
                                }
                            >
                                <option value="">
                                    All Status
                                </option>

                                <option value="UNACKNOWLEDGED">
                                    Unacknowledged
                                </option>

                                <option value="ACKNOWLEDGED">
                                    Acknowledged
                                </option>
                            </select>

                        </div>

                        {filteredAlerts.length === 0 ? (

                            <div
                                style={{
                                    padding: "30px",
                                    textAlign: "center",
                                    color: "#777"
                                }}
                            >
                                No alerts detected.
                            </div>

                        ) : (

                            filteredAlerts
                                .slice()
                                .reverse()
                                .map(alert => (

                                    <div
                                        key={alert.id}
                                        style={{
                                            border: "1px solid #DDD",
                                            borderLeft:
                                                alert.severity === "CRITICAL"
                                                    ? "6px solid #C62828"
                                                    : alert.severity === "HIGH"
                                                        ? "6px solid #EF6C00"
                                                        : "6px solid #F9A825",
                                            padding: "12px",
                                            marginBottom: "10px",
                                            borderRadius: "6px"
                                        }}
                                    >

                                        <div
                                            style={{
                                                display: "flex",
                                                justifyContent:
                                                    "space-between"
                                            }}
                                        >

                                            <b>
                                                {alert.title}
                                            </b>

                                            <span>
                                                {alert.severity}
                                            </span>

                                        </div>

                                        <div
                                            style={{
                                                marginTop: "6px"
                                            }}
                                        >
                                            {alert.message}
                                        </div>

                                        <div
                                            style={{
                                                display: "flex",
                                                alignItems: "center",
                                                gap: "12px",
                                                marginTop: "8px",
                                                padding: "8px",
                                                background: "#F8F8F8",
                                                borderRadius: "4px"
                                            }}
                                        >
                                            <div>
                                                <b>Risk Level:</b>{" "}
                                                {alert.riskLevel || "Low"}
                                            </div>

                                            <div>
                                                <b>Risk Score:</b>{" "}
                                                {alert.riskScore ?? 0}/100
                                            </div>
                                        </div>

                                        <div
                                            style={{
                                                marginTop: "6px",
                                                fontSize: "12px",
                                                color: "#666"
                                            }}
                                        >
                                            {alert.timestamp}
                                        </div>

                                        <div
                                            style={{
                                                marginTop: "8px",
                                                padding: "8px",
                                                background: "#F8F8F8",
                                                borderRadius: "4px",
                                                fontSize: "12px",
                                                color: "#555"
                                            }}
                                        >

                                            <div>
                                                <b>Packet ID:</b>{" "}
                                                {alert.packetId ?? "-"}
                                            </div>

                                            <div>
                                                <b>Protocol:</b>{" "}
                                                {alert.protocol ?? "-"}
                                            </div>

                                            <div>
                                                <b>Source:</b>{" "}
                                                {alert.source ?? "-"}
                                                {alert.sourcePort
                                                    ? `:${alert.sourcePort}`
                                                    : ""}
                                            </div>

                                            <div>
                                                <b>Destination:</b>{" "}
                                                {alert.destination ?? "-"}
                                                {alert.destinationPort
                                                    ? `:${alert.destinationPort}`
                                                    : ""}
                                            </div>

                                        </div>

                                        <div
                                            style={{
                                                display: "flex",
                                                gap: "8px",
                                                marginTop: "8px",
                                                flexWrap: "wrap"
                                            }}
                                        >

                                            {alert.packetId && (
                                                <button
                                                    className="btn"
                                                    onClick={() =>
                                                        onViewPacket(
                                                            alert.packetId
                                                        )
                                                    }
                                                >
                                                    View Packet
                                                </button>
                                            )}

                                            {!alert.acknowledged && (
                                                <button
                                                    className="btn"
                                                    onClick={() =>
                                                        onAcknowledge(
                                                            alert.id
                                                        )
                                                    }
                                                >
                                                    ✓ Acknowledge
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))
                        )}

                    </div>

                </div>
            );
        });

        const scrollToScanHistory = () => {
            const modal = document.getElementById(
                "historical-trends-modal-content"
            );
            const heading = document.getElementById("scan-history-section");

            if (!modal || !heading) return;

            const modalRect = modal.getBoundingClientRect();
            const headingRect = heading.getBoundingClientRect();

            modal.scrollTo({
                top: modal.scrollTop + headingRect.top - modalRect.top - 30,
                behavior: "auto"
            });
        };
        
        const HistoricalTrendsModal = React.memo(function HistoricalTrendsModal({
            show,
            loading,
            error,
            scans,
            onClose,
            onLoadHistory,
            page,
            pageSize,
            total,
            totalPages,
            startDate,
            endDate
        }) {


            const [filterStartDate, setFilterStartDate] = React.useState(startDate || "");
            const [filterEndDate, setFilterEndDate] = React.useState(endDate || "");

            React.useEffect(() => {
                setFilterStartDate(startDate || "");
                setFilterEndDate(endDate || "");
            }, [startDate, endDate]);
            
            const [comparisonScanA, setComparisonScanA] = React.useState("");

            const [comparisonScanB, setComparisonScanB] = React.useState("");

            const history = Array.isArray(scans) ? scans : [];

            React.useEffect(() => {
                if (history.length >= 2) {
                    setComparisonScanA(String(history[history.length - 2].scanId));
                    setComparisonScanB(String(history[history.length - 1].scanId));
                } else {
                    setComparisonScanA("");
                    setComparisonScanB("");
                }
            }, [scans, show]);

            if (!show) return null;

            const formatDate = scan => {
                const value = scan.generatedISO || scan.generated;
                if (!value) return "-";

                const date = new Date(value);
                return Number.isNaN(date.getTime())
                    ? String(value)
                    : date.toLocaleString();
            };

            const formatBytes = value => {
                let bytes = Number(value || 0);

                if (!Number.isFinite(bytes) || bytes < 0) {
                    return "-";
                }

                const units = ["Bytes", "KB", "MB", "GB", "TB"];
                let index = 0;

                while (bytes >= 1024 && index < units.length - 1) {
                    bytes /= 1024;
                    index++;
                }

                return `${bytes.toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
            };

            const makeChartData = field =>
                history
                    .map((scan, index) => {
                        const rawValue = scan[field];

                        if (
                            rawValue === null ||
                            rawValue === undefined ||
                            rawValue === "" ||
                            !Number.isFinite(Number(rawValue))
                        ) {
                            return null;
                        }

                        const count = Number(rawValue);

                        if (
                            field === "riskScore" &&
                            (count < 0 || count > 100)
                        ) {
                            return null;
                        }

                        return {
                            name: `Scan ${index + 1}`,
                            count
                        };
                    })
                    .filter(item => item !== null);

            const selectedScanA = history.find(
                scan => String(scan.scanId) === comparisonScanA
            );

            const selectedScanB = history.find(
                scan => String(scan.scanId) === comparisonScanB
            );

            const comparisonMetrics = [
                {
                    label: "Total Packets",
                    field: "totalPackets",
                    format: value => Number(value).toLocaleString()
                },
                {
                    label: "Traffic Volume",
                    field: "totalBytes",
                    format: formatBytes
                },
                {
                    label: "Throughput (Mbps)",
                    field: "throughputMbps",
                    format: value => Number(value).toFixed(2)
                },
                {
                    label: "Packet Rate",
                    field: "packetRate",
                    format: value => Number(value).toFixed(2)
                },
                {
                    label: "Risk Score",
                    field: "riskScore",
                    format: value => `${Number(value)}/100`
                }
            ];

            const getDifference = (scanA, scanB, field) => {
                const rawA = scanA?.[field];
                const rawB = scanB?.[field];

                if (
                    rawA == null ||
                    rawB == null ||
                    rawA === "" ||
                    rawB === ""
                ) {
                    return null;
                }

                const a = Number(rawA);
                const b = Number(rawB);

                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    return null;
                }

                if (
                    field === "riskScore" &&
                    (a < 0 || a > 100 || b < 0 || b > 100)
                ) {
                    return null;
                }

                return b - a;
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div
                        className="modal-content"
                        id="historical-trends-modal-content"
                        style={{
                            width: "1200px",
                            maxWidth: "96%",
                            maxHeight: "90vh",
                            overflowY: "auto"
                        }}
                        onClick={event => event.stopPropagation()}
                    >
                        <div style={styles.modalHeader}>
                            <h2>📈 Historical Trends</h2>
                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>
                        </div>

                        <hr className="divider" />

                        {loading ? (
                            <div style={styles.centerMessage}>
                                Loading Historical Trends...
                            </div>
                        ) : error ? (
                            <div style={{
                                ...styles.centerMessage,
                                color: "#C62828"
                            }}>
                                {error}
                            </div>
                        ) : history.length === 0 ? (
                            <div style={styles.centerMessage}>
                                No historical scan data available.
                            </div>
                        ) : (
                            <>
                                <div style={{
                                    display: "flex",
                                    flexWrap: "wrap",
                                    alignItems: "center",
                                    columnGap: "12px",
                                    rowGap: "12px",
                                    marginBottom: "18px"
                                }}>
                                    <label style={{
                                        display: "inline-flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        marginRight: "8px"
                                    }}>
                                        From
                                        <input
                                            type="date"
                                            value={filterStartDate}
                                            max={filterEndDate || undefined}
                                            onChange={e => setFilterStartDate(e.target.value)}
                                            style={{
                                                width: "180px",
                                                height: "38px",
                                                padding: "6px 8px",
                                                fontSize: "15px",
                                                boxSizing: "border-box"
                                            }}
                                        />
                                    </label>

                                    <label style={{
                                        display: "inline-flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        marginRight: "8px"
                                    }}>
                                        To 
                                        <input
                                            type="date"
                                            value={filterEndDate}
                                            min={filterStartDate || undefined}
                                            onChange={e => setFilterEndDate(e.target.value)}
                                            style={{
                                                width: "180px",
                                                height: "38px",
                                                padding: "6px 8px",
                                                fontSize: "15px",
                                                boxSizing: "border-box"
                                            }}
                                        />
                                    </label>

                                    <label style={{
                                        display: "inline-flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        marginRight: "8px"
                                    }}>
                                        Rows per page 
                                        <select
                                            value={pageSize}
                                            onChange={e => onLoadHistory(
                                                1,
                                                Number(e.target.value),
                                                filterStartDate,
                                                filterEndDate
                                            )}
                                            style={{
                                                minWidth: "85px",
                                                height: "38px",
                                                padding: "6px 8px",
                                                fontSize: "15px",
                                                boxSizing: "border-box"
                                            }}
                                        >
                                            {[15, 25, 50, 100, 250, 500].map(size => (
                                                <option key={size} value={size}>{size}</option>
                                            ))}
                                        </select>
                                    </label>

                                    <button
                                        className="btn"
                                        disabled={loading || (
                                            filterStartDate &&
                                            filterEndDate &&
                                            filterStartDate > filterEndDate
                                        )}
                                        onClick={() => onLoadHistory(
                                            1, pageSize, filterStartDate, filterEndDate
                                        )}
                                    >
                                        Apply
                                    </button>

                                    <button
                                        className="btn"
                                        disabled={loading}
                                        onClick={() => {
                                            setFilterStartDate("");
                                            setFilterEndDate("");
                                            onLoadHistory(1, pageSize, "", "");
                                        }}
                                    >
                                        Clear
                                    </button>
                                </div>    

                                <h3 style={styles.sectionTitle}>
                                    Total Packets Across Scans
                                </h3>
                                <LineChart data={makeChartData("totalPackets")} />

                                <h3 style={styles.sectionTitle}>
                                    Throughput (Mbps) Across Scans
                                </h3>
                                <LineChart data={makeChartData("throughputMbps")} />

                                <h3 style={styles.sectionTitle}>
                                    Risk Score Across Scans
                                </h3>
                                <LineChart data={makeChartData("riskScore")} fixedMax={100} valueSuffix="/100" />

                                <h3 style={styles.sectionTitle}>
                                    Scan-to-Scan Comparison
                                </h3>

                                <h4>Baseline Scan</h4>

                                <select
                                    value={comparisonScanA}
                                    onChange={event => setComparisonScanA(event.target.value)}
                                >
                                    {history.map(scan => (
                                        <option
                                            key={String(scan.scanId)}
                                            value={String(scan.scanId)}
                                        >
                                            {`${formatDate(scan)} - ${String(scan.scanId).slice(0, 8)}`}
                                        </option>
                                    ))}
                                </select>

                                <h4>Comparison Scan</h4>

                                <select
                                    value={comparisonScanB}
                                    onChange={event => setComparisonScanB(event.target.value)}
                                >
                                    {history.map(scan => (
                                        <option
                                            key={String(scan.scanId)}
                                            value={String(scan.scanId)}
                                        >
                                            {`${formatDate(scan)} - ${String(scan.scanId).slice(0, 8)}`}
                                        </option>
                                    ))}
                                </select>

                                {history.length < 2 ? (
                                    <p>Select at least two scans to compare.</p>
                                ) : !selectedScanA || !selectedScanB ? (
                                    <p>Please select both scans.</p>
                                ) : comparisonScanA === comparisonScanB ? (
                                    <p>Please select two different scans.</p>
                                ) : (
                                    <div style={{ overflowX: "auto", margin: "15px 0" }}>
                                        <table style={styles.tableFullWidth}>
                                            <thead>
                                                <tr>
                                                    {["Metric", "Baseline Scan", "Comparison Scan", "Difference"].map(
                                                        heading => (
                                                            <th key={heading} style={styles.tableHeaderCell}>
                                                                {heading}
                                                            </th>
                                                        )
                                                    )}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {comparisonMetrics.map(metric => {
                                                    const a = selectedScanA[metric.field];
                                                    const b = selectedScanB[metric.field];
                                                    const difference = getDifference(
                                                        selectedScanA,
                                                        selectedScanB,
                                                        metric.field
                                                    );

                                                    const isValidMetric = (value, field) => {
                                                        if (
