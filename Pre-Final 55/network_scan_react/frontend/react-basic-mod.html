                                                childCount={getChildren(device.endpointId).length}
                                                topologyLevel="Endpoint"
                                                linkConfidence={device.confidence || "100%"}

                                                highlight={
                                                    isSelectedPath(device) ||
                                                    isSearchMatch(device)
                                                }

                                                onContextMenu={(event) =>
                                                    openContextMenu(event, device)
                                                }

                                                onClick={() => {
                                                    setSelectedEndpoint(device.endpointId);
                                                    onNodeClick(device);
                                                }}
                                            />

                                            {
                                                getChildren(device.endpointId).length > 0 && (
                                                    <button
                                                        style={treeStyles.collapseButton}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            toggleNode(device.endpointId);
                                                        }}
                                                    >
                                                        {
                                                            collapsedNodes[device.endpointId]
                                                                ? `+${getChildren(device.endpointId).length}`
                                                                : "−"
                                                        }
                                                    </button>
                                                )
                                            }
                                        </div>

                                        {
                                            !collapsedNodes[device.endpointId] &&
                                            renderChildDevices(device.endpointId)
                                        }

                                    </div>
                                );

                            })}

                        </div>

                    </div>

                );

            }

            const gatewayChildren = getChildren(topology?.gateway?.endpointId);
            const stats = buildTopologyStatistics(topology);
            const [collapsedNodes, setCollapsedNodes] = React.useState({});
            const [selectedEndpoint, setSelectedEndpoint] = React.useState(null);
            const [topologySearch, setTopologySearch] = React.useState("");
            const selectedPath = getSelectedPath();

            const topologyViewportRef = React.useRef(null);

            const [miniMapViewport, setMiniMapViewport] = React.useState({
                x: 0,
                y: 0,
                width: 360,
                height: 190
            });

            const updateMiniMapViewport = React.useCallback(() => {

                const viewport = topologyViewportRef.current;

                if (!viewport)
                    return;

                const scrollWidth = viewport.scrollWidth;
                const scrollHeight = viewport.scrollHeight;

                const clientWidth = viewport.clientWidth;
                const clientHeight = viewport.clientHeight;

                const scrollLeft = viewport.scrollLeft;
                const scrollTop = viewport.scrollTop;

                const maxScrollLeft = Math.max(
                    0,
                    scrollWidth - clientWidth
                );

                const maxScrollTop = Math.max(
                    0,
                    scrollHeight - clientHeight
                );

                const width =
                    scrollWidth > 0
                        ? Math.min(
                            360,
                            (clientWidth / scrollWidth) * 360
                        )
                        : 360;

                const height =
                    scrollHeight > 0
                        ? Math.min(
                            190,
                            (clientHeight / scrollHeight) * 190
                        )
                        : 190;

                const x =
                    maxScrollLeft > 0
                        ? (scrollLeft / maxScrollLeft) *
                        (360 - width)
                        : 0;

                const y =
                    maxScrollTop > 0
                        ? (scrollTop / maxScrollTop) *
                        (190 - height)
                        : 0;

                setMiniMapViewport({
                    x,
                    y,
                    width,
                    height
                });

            }, []);

            React.useEffect(() => {

                if (!show)
                    return;

                const viewport = topologyViewportRef.current;

                if (!viewport)
                    return;

                viewport.addEventListener(
                    "scroll",
                    updateMiniMapViewport
                );

                const resizeObserver =
                    new ResizeObserver(
                        updateMiniMapViewport
                    );

                resizeObserver.observe(viewport);

                requestAnimationFrame(
                    updateMiniMapViewport
                );

                return () => {

                    viewport.removeEventListener(
                        "scroll",
                        updateMiniMapViewport
                    );

                    resizeObserver.disconnect();

                };

            }, [
                show,
                zoom,
                topology,
                collapsedNodes,
                updateMiniMapViewport
            ]);

            const [contextMenu, setContextMenu] = React.useState({
                visible: false,
                x: 0,
                y: 0,
                device: null
            });

            React.useEffect(() => {

                function handleEsc(event) {
                    if (event.key === "Escape") {
                        closeContextMenu();
                    }
                }

                window.addEventListener("keydown", handleEsc);

                return () => {
                    window.removeEventListener("keydown", handleEsc);
                };

            }, []);

            function toggleNode(endpointId) {

                setCollapsedNodes(prev => ({
                    ...prev,
                    [endpointId]: !prev[endpointId]
                }));

            }

            function getTopologyNodeMap() {

                const allNodes = [
                    ...(topology?.gateway ? [topology.gateway] : []),
                    ...(topology?.devices || [])
                ];

                const nodeMap = new Map();

                allNodes.forEach(device => {

                    if (device?.endpointId) {
                        nodeMap.set(
                            device.endpointId,
                            device
                        );
                    }

                });

                return nodeMap;
            }

            function getProtocolColor(protocol) {
                switch ((protocol || "").toUpperCase()) {

                    case "TCP":
                        return "#1565C0";   // Blue

                    case "UDP":
                        return "#C2185B";   // Magenta

                    case "ICMP":
                        return "#EF6C00";   // Orange

                    case "ARP":
                        return "#7B1FA2";   // Deep Purple

                    case "HTTP":
                        return "#5D4037";   // Dark Brown

                    case "HTTPS":
                        return "#00838F";   // Cyan / Teal

                    case "DNS":
                        return "#AFB42B";   // Yellow-Green / Olive

                    default:
                        return "#455A64";   // Blue-Grey
                }
            }

            function normalizePacketIP(value) {

                if (value === undefined || value === null) {
                    return "";
                }

                let ip = String(value)
                    .trim()
                    .toLowerCase();

                /*
                * Remove:
                *
                * 192.168.1.10:52341
                * 192.168.1.10
                *
                * Keep only the IPv4 address.
                */
                const match = ip.match(
                    /(\d{1,3}(?:\.\d{1,3}){3})/
                );

                return match
                    ? match[1]
                    : ip;
            }

            function findTopologyDeviceByIP(nodeMap, ip) {

                const normalizedTarget =
                    normalizePacketIP(ip);

                if (!normalizedTarget) {
                    return null;
                }

                for (const device of nodeMap.values()) {

                    const deviceIP =
                        normalizePacketIP(
                            device?.ip
                        );

                    if (!deviceIP) {
                        continue;
                    }

                    if (deviceIP === normalizedTarget) {
                        return device;
                    }
                }

                return null;
            }

            function navigateTopologyViewport(
                xRatio,
                yRatio
            ) {

                const viewport =
                    topologyViewportRef.current;

                if (!viewport)
                    return;

                const maxScrollLeft = Math.max(
                    0,
                    viewport.scrollWidth - viewport.clientWidth
                );

                const maxScrollTop = Math.max(
                    0,
                    viewport.scrollHeight - viewport.clientHeight
                );

                const targetLeft =
                    xRatio * maxScrollLeft;

                const targetTop =
                    yRatio * maxScrollTop;

                viewport.scrollTo({
                    left: Math.max(
                        0,
                        Math.min(
                            targetLeft,
                            maxScrollLeft
                        )
                    ),
                    top: Math.max(
                        0,
                        Math.min(
                            targetTop,
                            maxScrollTop
                        )
                    ),
                    behavior: "smooth"
                });
            }

            function panTopologyViewport(
                deltaX,
                deltaY
            ) {

                const viewport =
                    topologyViewportRef.current;

                if (!viewport)
                    return;

                const maxScrollLeft = Math.max(
                    0,
                    viewport.scrollWidth -
                    viewport.clientWidth
                );

                const maxScrollTop = Math.max(
                    0,
                    viewport.scrollHeight -
                    viewport.clientHeight
                );

                viewport.scrollLeft +=
                    (deltaX / 360) *
                    maxScrollLeft;

                viewport.scrollTop +=
                    (deltaY / 190) *
                    maxScrollTop;
            }

            function isSelectedPath(device) {

                if (!selectedEndpoint)
                    return false;

                let current = topology?.devices?.find(
                    d => d.endpointId === selectedEndpoint
                );

                while (current) {

                    if (current.endpointId === device.endpointId)
                        return true;

                    current = topology?.devices?.find(
                        d => d.endpointId === current.parentId
                    );

                }

                return device.endpointId === topology?.gateway?.endpointId;

            }

            function getSelectedPath() {

                if (!selectedEndpoint)
                    return [];

                const nodeMap = new Map();

                if (topology?.gateway?.endpointId) {
                    nodeMap.set(
                        topology.gateway.endpointId,
                        topology.gateway
                    );
                }

                (topology?.devices || []).forEach(device => {
                    if (device?.endpointId) {
                        nodeMap.set(
                            device.endpointId,
                            device
                        );
                    }
                });

                const path = [];
                const visited = new Set();

                let current = nodeMap.get(selectedEndpoint);

                while (current && !visited.has(current.endpointId)) {

                    visited.add(current.endpointId);

                    path.unshift(current);

                    if (!current.parentId)
                        break;

                    current = nodeMap.get(current.parentId);
                }

                return path;
            }

            function openContextMenu(event, device) {

                event.preventDefault();

                setContextMenu({
                    visible: true,
                    x: event.clientX,
                    y: event.clientY,
                    device
                });

            }

            function closeContextMenu() {

                setContextMenu({
                    visible: false,
                    x: 0,
                    y: 0,
                    device: null
                });

            }

            function copyToClipboard(text) {

                if (!text)
                    return;

                navigator.clipboard.writeText(text);

                closeContextMenu();

            }

            function openDeviceWeb(device) {

                if (!device) {
                    return;
                }

                /*
                * Device does not expose HTTP/HTTPS.
                */
                if (!device.httpBannerDetected) {

                    closeContextMenu();

                    alert(
                        "This device does not expose an HTTP/HTTPS Web Interface."
                    );

                    return;
                }

                /*
                * HTTP/HTTPS was detected, but IP is missing.
                */
                if (!device.ip) {

                    closeContextMenu();

                    alert(
                        "HTTP/HTTPS Web Interface was detected, but the device IP address is unavailable."
                    );

                    return;
                }

                /*
                * Accept only HTTP or HTTPS.
                */
                const scheme =
                    String(device.httpScheme || "HTTP").trim().toLowerCase();

                if (scheme !== "http" && scheme !== "https") {

                    closeContextMenu();

                    alert(
                        `Unsupported Web Interface protocol: ${device.httpScheme || "Unknown"}`
                    );

                    return;
                }

                /*
                * Optional port.
                *
                * Current backend may not provide httpPort.
                * Therefore the URL remains:
                *
                * http://192.168.1.10
                *
                * If httpPort is available in future:
                *
                * http://192.168.1.10:8080
                */
                const port =
                    device.httpPort
                        ? `:${device.httpPort}`
                        : "";

                const url =
                    `${scheme}://${device.ip}${port}`;

                /*
                * Close the context menu BEFORE opening
                * the Web Interface.
                *
                * This prevents the topology/context-menu layer
                * from remaining visually active.
                */
                closeContextMenu();

                /*
                * Open the device Web Interface in a new tab.
                */
                const webWindow =
                    window.open(
                        url,
                        "_blank",
                        "noopener,noreferrer"
                    );

                /*
                * Browser popup blocker protection.
                */
                if (!webWindow) {

                    alert(
                        "The Web Interface could not be opened. " +
                        "Please allow pop-ups for this Network Scan page."
                    );

                    return;
                }
            }

            function openDeviceDetails(device) {

                if (!device)
                    return;

                onDeviceDetails(device);
                closeContextMenu();
            }

            function openSecurityAnalysis(device) {

                if (!device)
                    return;

                onSecurityAnalysis(device);

                closeContextMenu();
            }

            function isSearchMatch(device) {

                if (!topologySearch.trim())
                    return false;

                const search = topologySearch.toLowerCase();

                return [

                    device.hostname,
                    device.ip,
                    device.mac,
                    device.endpointId,
                    device.manufacturer

                ]
                    .filter(Boolean)
                    .some(value =>
                        value.toLowerCase().includes(search)
                    );
            }

            function expandParents(endpointId) {

                const expanded = {};

                let current = topology?.devices?.find(
                    d => d.endpointId === endpointId
                );

                while (current && current.parentId) {

                    expanded[current.parentId] = false;

                    current = topology?.devices?.find(
                        d => d.endpointId === current.parentId
                    );
                }

                setCollapsedNodes(prev => ({
                    ...prev,
                    ...expanded
                }));
            }

            const NODE_WIDTH = 180;
            const NODE_GAP = 20;
            const treeStyles = {

                level: {
                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    flexWrap: "wrap",
                    gap: "60px",
                    width: "100%",
                    marginTop: "20px",
                    marginBottom: "20px"
                },

                nodeWrapper: {
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    minWidth: "180px",
                    flex: "0 0 auto"
                },

                childrenLevel: {
                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    flexWrap: "wrap",
                    gap: "20px",
                    marginTop: "20px"
                },

                verticalLine: {
                    width: "4px",
                    height: "35px",
                    background: "#556B2F"
                },

                wirelessVerticalLine: {
                    width: "4px",
                    height: "35px",
                    background:
                        "repeating-linear-gradient(to bottom,#1565C0 0px,#1565C0 6px,transparent 6px,transparent 12px)"
                },

                horizontalLine: {

                    alignSelf: "stretch",
                    height: "4px",
                    background: "#556B2F"
                },

                childrenContainer: {
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    width: "100%"
                },

                childNodes: {

                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    gap: `${NODE_GAP}px`,
                    marginTop: "0px",
                    flexWrap: "nowrap"
                },

                collapseButton: {
                    marginTop: "10px",
                    marginLeft: "8px",
                    width: "24px",
                    height: "24px",
                    minWidth: "24px",
                    padding: "0",
                    borderRadius: "50%",
                    border: "2px solid #556B2F",
                    background: "#FFFFFF",
                    color: "#556B2F",
                    cursor: "pointer",
                    fontWeight: "bold",
                    fontSize: "14px",
                    lineHeight: "20px",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                    position: "relative",
                    zIndex: 5
                }

            };

            return (

                <div
                    className="modal-overlay"
                    onClick={() => {

                        closeContextMenu();
                        onClose();

                    }}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "95vw",
                            maxWidth: "95vw",
                            height: "calc(100vh - 30px)",
                            maxHeight: "calc(100vh - 30px)",
                            overflow: "hidden",
                            position: "relative",
                            display: "flex",
                            flexDirection: "column"
                        }}
                        onClick={(e) => {

                            e.stopPropagation();
                            closeContextMenu();

                        }}
                    >

                        <div style={styles.modalHeader}>

                            <div>
                                <h2>Network Topology</h2>

                                <div
                                    style={{
                                        display: "flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        marginTop: "8px"
                                    }}
                                >

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(z => Math.min(z + 0.1, 2))}
                                    >
                                        +
                                    </button>

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(z => Math.max(z - 0.1, 0.5))}
                                    >
                                        −
                                    </button>

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(1)}
                                    >
                                        Reset
                                    </button>

                                    <span
                                        style={{
                                            fontWeight: "700",
                                            color: "#556B2F"
                                        }}
                                    >
                                        {(zoom * 100).toFixed(0)}%
                                    </span>

                                </div>

                            </div>
                            <div
                                style={{
                                    marginTop: "12px",
                                    display: "flex",
                                    alignItems: "center",
                                    gap: "10px"
                                }}
                            >

                                <span
                                    style={{
                                        fontWeight: "700",
                                        color: "#556B2F",
                                        minWidth: "60px"
                                    }}
                                >
                                    Search
                                </span>

                                <input
                                    type="text"
                                    placeholder="Hostname / IP Address / MAC Address / Endpoint ID / Manufacturer"
                                    value={topologySearch}
                                    onChange={(e) => {

                                        const value = e.target.value;
                                        setTopologySearch(value);

                                        if (!value.trim())
                                            return;

                                        const match = topology?.devices?.find(device =>
                                            [
                                                device.hostname,
                                                device.ip,
                                                device.mac,
                                                device.endpointId,
                                                device.manufacturer
                                            ]
                                                .filter(Boolean)
                                                .some(v =>
                                                    v.toLowerCase().includes(value.toLowerCase())
                                                )
                                        );

                                        if (match)
                                            expandParents(match.endpointId);
                                    }}
                                    style={{
                                        width: "430px",
                                        padding: "8px 12px",
                                        border: "2px solid #556B2F",
                                        borderRadius: "6px",
                                        fontSize: "14px",
                                        outline: "none"
                                    }}
                                />

                                {
                                    topologySearch &&
                                    <button
                                        className="btn"
                                        onClick={() => setTopologySearch("")}
                                    >
                                        Clear
                                    </button>
                                }

                            </div>

                            <div
                                style={{
                                    display: "grid",
                                    gridTemplateColumns: "repeat(4, auto)",
                                    gap: "10px 30px",
                                    marginTop: "8px",
                                    fontSize: "13px",
                                    fontWeight: "500",
                                    color: "#444"
                                }}
                            >

                                <div>🌐 Gateway : {topology?.summary?.gatewayCount ?? 0}</div>

                                <div>🖧 Switches : {topology?.summary?.switchCount ?? 0}</div>

                                <div>📶 Access Points : {topology?.summary?.accessPointCount ?? 0}</div>

                                <div>🖥 Endpoints : {topology?.summary?.deviceCount ?? 0}</div>

                                <div style={{ color: "#2E7D32" }}>
                                    🟢 Online : {stats.online}
                                </div>

                                <div style={{ color: "#C62828" }}>
                                    🔴 Offline : {stats.offline}
                                </div>

                                <div>
                                    🔌 Wired : {stats.wired}
                                </div>

                                <div>
                                    📶 Wireless : {stats.wireless}
                                </div>

                                <div style={{ color: "#C62828" }}>
                                    🔴 Critical : {stats.critical}
                                </div>

                                <div style={{ color: "#EF6C00" }}>
                                    🟠 High : {stats.high}
                                </div>

                                <div style={{ color: "#F9A825" }}>
                                    🟡 Medium : {stats.medium}
                                </div>

                                <div style={{ color: "#2E7D32" }}>
                                    🟢 Low : {stats.low}
                                </div>

                            </div>
                            <div style={{ width: "240px" }}></div>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <TopologyLegend />
                        {
                            selectedPath.length > 0 &&

                            <div
                                style={{
                                    marginBottom: "20px",
                                    padding: "12px",
                                    border: "1px solid #556B2F",
                                    borderRadius: "8px",
                                    background: "#F7FAF1",
                                    fontWeight: "600",
                                    color: "#2E7D32",
                                    fontSize: "15px"
                                }}
                            >

                                <span>📍 Selected Path :</span>

                                {
                                    selectedPath.map((device, index) => (

                                        <React.Fragment key={device.endpointId || index}>

                                            {index > 0 && "  →  "}

                                            {device.hostname || device.ip || "Gateway"}

                                        </React.Fragment>

                                    ))
                                }

                            </div>
                        }
                        {
                            loading ? (

                                <div style={styles.centerMessage}>
                                    Building Network Topology...
                                </div>

                            ) : (

                                <>

                                    <TopologyMiniMap
                                        topology={topology}
                                        selectedEndpoint={selectedEndpoint}
                                        viewport={miniMapViewport}
                                        onNavigate={navigateTopologyViewport}
                                        onPan={panTopologyViewport}
                                        onNodeClick={(device) => {

                                            setSelectedEndpoint(
                                                device.endpointId
                                            );

                                            expandParents(
                                                device.endpointId
                                            );

                                            onNodeClick(device);
                                        }}
                                    />

                                    <div
                                        ref={topologyViewportRef}
                                        onScroll={updateMiniMapViewport}
                                        style={{
                                            flex: "1 1 auto",
                                            minHeight: "320px",
                                            overflow: "auto",
                                            border: "1px solid #DDDDDD",
                                            borderRadius: "8px",
                                            background: "#FFFFFF",
                                            position: "relative",
                                            padding: "10px"
                                        }}
                                    >

                                        <div
                                            style={{
                                                zoom: zoom,
                                                transformOrigin: "top left"
                                            }}
                                        >

                                            <div style={treeStyles.level}>

                                                <NetworkNode

                                                    icon="🌐"

                                                    title={
                                                        topology?.gateway?.hostname ||
                                                        topology?.gateway?.ip ||
                                                        "Gateway"
                                                    }

                                                    subtitle={topology?.gateway?.ip}
                                                    manufacturer={topology?.gateway?.manufacturer}
                                                    deviceType={topology?.gateway?.deviceType}
                                                    macAddress={topology?.gateway?.mac}
                                                    vendor={topology?.gateway?.manufacturer}
                                                    connectionType="Gateway"
                                                    riskLevel={topology?.gateway?.deviceRiskLevel}
                                                    riskScore={topology?.gateway?.deviceRiskScore}
                                                    riskReason={
                                                        topology?.gateway?.deviceRiskReasons?.[0]?.text ||
                                                        topology?.gateway?.deviceRiskReasons?.[0] ||
                                                        "-"
                                                    }

                                                    status={topology?.gateway?.active}
                                                    parentName="-"
                                                    childCount={gatewayChildren.length}
                                                    topologyLevel="Root"
                                                    linkConfidence="100%"
                                                    highlight={
                                                        selectedEndpoint !== null ||

                                                        (
                                                            topologySearch &&
                                                            (
                                                                topology?.gateway?.hostname ||
                                                                topology?.gateway?.ip ||
                                                                ""
                                                            )
                                                                .toLowerCase()
                                                                .includes(topologySearch.toLowerCase())
                                                        )
                                                    }
                                                    onContextMenu={(event) =>
                                                        openContextMenu(event, topology?.gateway)
                                                    }
                                                    onClick={() => {
                                                        setSelectedEndpoint(topology?.gateway?.endpointId);
                                                        onNodeClick(topology?.gateway);
                                                    }}

                                                />
                                                {
                                                    gatewayChildren.length > 0 && (

                                                        <button
                                                            style={treeStyles.collapseButton}
                                                            onClick={(e) => {

                                                                e.stopPropagation();

                                                                toggleNode(topology.gateway.endpointId);

                                                            }}
                                                        >

                                                            {
                                                                collapsedNodes[topology.gateway.endpointId]
                                                                    ? `+${gatewayChildren.length}`
                                                                    : "−"
                                                            }

                                                        </button>
                                                    )
                                                }
                                            </div>

                                            <div
                                                style={{
                                                    display: "flex",
                                                    justifyContent: "space-between",
                                                    alignItems: "flex-start",
                                                    marginTop: "30px"
                                                }}
                                            >

                                                {
                                                    !collapsedNodes[topology?.gateway?.endpointId] &&
                                                    renderChildDevices(topology?.gateway?.endpointId)
                                                }
                                            </div>

                                        </div>
                                    </div>
                                </>

                            )
                        }
                        {
                            contextMenu.visible && (

                                <div
                                    style={{
                                        position: "fixed",
                                        left: contextMenu.x,
                                        top: contextMenu.y,
                                        background: "#FFFFFF",
                                        border: "1px solid #CCCCCC",
                                        borderRadius: "8px",
                                        boxShadow: "0 4px 12px rgba(0,0,0,0.25)",
                                        minWidth: "260px",
                                        zIndex: 99999,
                                        overflow: "hidden"
                                    }}
                                    onClick={(e) => e.stopPropagation()}
                                >

                                    <div
                                        style={{
                                            padding: "10px",
                                            fontWeight: "700",
                                            background: "#556B2F",
                                            color: "#FFFFFF"
                                        }}
                                    >
                                        {contextMenu.device?.hostname ||
                                            contextMenu.device?.ip ||
                                            "Device"}
                                    </div>

                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() => {
                                            openDeviceDetails(contextMenu.device)
                                        }}
                                    >
                                        📋 Device Details
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.ip)
                                        }
                                    >
                                        📄 Copy IP Address
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.mac)
                                        }
                                    >
                                        📄 Copy MAC Address
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.hostname)
                                        }
                                    >
                                        📄 Copy Hostname
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.endpointId)
                                        }
                                    >
                                        📄 Copy Endpoint ID
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.manufacturer)
                                        }
                                    >
                                        📄 Copy Manufacturer
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            openDeviceWeb(contextMenu.device)
                                        }
                                    >
                                        🌐 Open Web Interface
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={(event) => {

                                            event.stopPropagation();

                                            openSecurityAnalysis(
                                                contextMenu.device
                                            );

                                        }}
                                    >
                                        🛡️ Security Analysis
                                    </div>
                                </div>

                            )
                        }
                        <div style={styles.modalFooter}>

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        });

        const CommunicationMatrixModal = React.memo(function CommunicationMatrixModal({
            show,
            communications,
            onClose
        }) {

            if (!show)
                return null;

            const totalPackets =
                communications.reduce(
                    (sum, item) =>
                        sum + item.packets,
                    0
                );

            const totalBytes =
                communications.reduce(
                    (sum, item) =>
                        sum + item.bytes,
                    0
                );

            const uniqueEndpoints =
                new Set(
                    communications.flatMap(item => [
                        item.source,
                        item.destination
                    ])
                ).size;

            return (
                <div
                    className="modal-overlay"
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "95vw",
                            maxWidth: "1400px",
                            maxHeight: "90vh",
                            overflow: "auto"
                        }}
                        onClick={(e) =>
                            e.stopPropagation()
                        }
                    >

                        <div style={styles.modalHeader}>

                            <div>

                                <h2>
                                    🔀 Device Communication Matrix
                                </h2>

                                <div
                                    style={{
                                        marginTop: "6px",
                                        color: "#666",
                                        fontSize: "13px"
                                    }}
                                >
                                    Live communication relationships
                                    derived from captured packets
                                </div>

                            </div>

                            <button
                                style={styles.closeButton}
                                onClick={onClose}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        {/* Summary */}

                        <div
                            style={{
                                display: "grid",
                                gridTemplateColumns:
                                    "repeat(3, 1fr)",
                                gap: "15px",
                                marginBottom: "20px"
                            }}
                        >

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Communication Entries
                                </div>

                                <div style={styles.summaryValue}>
                                    {communications.length}
                                </div>

                            </div>

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Unique Endpoints
                                </div>

                                <div style={styles.summaryValue}>
                                    {uniqueEndpoints}
                                </div>

                            </div>

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Total Packets
                                </div>

                                <div style={styles.summaryValue}>
                                    {totalPackets.toLocaleString()}
                                </div>

                            </div>

                        </div>

                        <div
                            style={{
                                marginBottom: "20px",
                                padding: "12px",
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                background: "#F9F9F9",
                                fontWeight: "600"
                            }}
                        >

                            Total Traffic :
                            {" "}
                            {totalBytes.toLocaleString()}
                            {" Bytes"}

                        </div>

                        {
                            communications.length === 0 ? (

                                <div
                                    style={styles.centerMessage}
                                >
                                    No communication data available.
                                </div>

                            ) : (

                                <div
                                    style={{
                                        overflowX: "auto"
                                    }}
                                >

                                    <table
                                        style={{
                                            ...styles.tableFullWidth,
                                            minWidth: "1100px"
                                        }}
                                    >

                                        <thead>

                                            <tr>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    #
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Source
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    S-Port
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Destination
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    D-Port
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Transport
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Protocol
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Packets
                                                </th>

                                                <th
                                                    style={
                                                        styles.tableHeaderCell
                                                    }
                                                >
                                                    Bytes
                                                </th>

                                            </tr>

                                        </thead>

                                        <tbody>

                                            {
                                                communications.map(
                                                    (item, index) => (

                                                        <tr
                                                            key={`${item.source}-${item.destination}-${item.protocol}-${item.sourcePort}-${item.destinationPort}`}
                                                        >

                                                            <td
                                                                style={
                                                                    styles.tableCell
                                                                }
                                                            >
                                                                {index + 1}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    fontFamily:
                                                                        "Consolas"
                                                                }}
                                                            >
                                                                {item.source}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "center"
                                                                }}
                                                            >
                                                                {item.sourcePort}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    fontFamily:
                                                                        "Consolas"
                                                                }}
                                                            >
                                                                {item.destination}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "center"
                                                                }}
                                                            >
                                                                {item.destinationPort}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "center",
                                                                    fontWeight:
                                                                        "600"
                                                                }}
                                                            >
                                                                {item.transport}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "center",
                                                                    fontWeight:
                                                                        "700",
                                                                    color:
                                                                        getProtocolColor(
                                                                            item.protocol
                                                                        )
                                                                }}
                                                            >
                                                                {item.protocol}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "right",
                                                                    fontWeight:
                                                                        "600"
                                                                }}
                                                            >
                                                                {item.packets.toLocaleString()}
                                                            </td>

                                                            <td
                                                                style={{
                                                                    ...styles.tableCell,
                                                                    textAlign:
                                                                        "right",
                                                                    fontWeight:
                                                                        "600"
                                                                }}
                                                            >
                                                                {item.bytes.toLocaleString()}
                                                            </td>

                                                        </tr>

                                                    )
                                                )
                                            }

                                        </tbody>

                                    </table>

                                </div>

                            )
                        }

                        <div
                            style={styles.modalFooter}
                        >

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>

                        </div>

                    </div>

                </div>
            );
        }
        );

        const TopologyLegend = React.memo(function TopologyLegend() {

            const itemStyle = {
                display: "flex",
                alignItems: "center",
                gap: "6px",
                fontWeight: "600",
                fontSize: "14px"
            };

            return (

                <div
                    style={{
                        border: "1px solid #CCCCCC",
                        borderRadius: "8px",
                        background: "#F9F9F9",
                        padding: "12px",
                        marginBottom: "20px"
                    }}
                >

                    <div
                        style={{
                            fontWeight: "700",
                            marginBottom: "10px",
                            color: "#556B2F"
                        }}
                    >
                        🧭 Topology Legend
                    </div>

                    <div
                        style={{
                            display: "flex",
                            flexWrap: "wrap",
                            gap: "18px"
                        }}
                    >
                        <div style={itemStyle}>🌐 Gateway</div>
                        <div style={itemStyle}>📡 Router</div>
                        <div style={itemStyle}>🖧 Switch</div>
                        <div style={itemStyle}>📶 Access Point</div>
                        <div style={itemStyle}>💻 Windows PC</div>
                        <div style={itemStyle}>🐧 Linux</div>

                explainability.scoreExplanation ||

                explainability.confidenceExplanation ||
                explainability.confidence ||
                {};

                    total + Number(item?.impact || 0),

                    value === undefined ||
                    value === null ||

                            padding: "7px",

                                                            ? (
                                                                scoreExplanation.evidenceComplete
                                                                    ? "Yes"
                                                                    : "No"
                                                            )
                                                            : (
                                                                confidence.evidenceComplete !== undefined
                                                                    ? (
                                                                        confidence.evidenceComplete
                                                                            ? "Yes"
                                                                            : "No"
                                                                    )
                                                                    : "-"

                                                    )
                                            }
                                        />

                    {/* CONFIDENCE */}

                    {(Object.keys(confidence).length > 0 ||

                                <div

                                                    : (

                                                            : "-"

                                            }

                                                confidence.availableEvidenceCount ??
                                                confidenceExplanation.availableEvidenceCount
                                            }
                                        />

                                        <FieldRow
                                            label="Total Evidence"

                                                confidence.totalEvidenceCount ??
                                                confidenceExplanation.totalEvidenceCount
                                            }

                                                confidenceExplanation.availableEvidenceWeight
                                            }
                                        />

                                        <FieldRow

                                            }
                                        />

                                                label="Source Field"

        const BatchAIAnalysisModal = React.memo(function BatchAIAnalysisModal({

                                                            <button

                        <div style={styles.modalFooter}>

        const PacketDetailsModal = React.memo(function PacketDetailsModal({

        const SecurityAnalysisModal = React.memo(function SecurityAnalysisModal({
            show,
            device,
            correlation,
            correlationLoading,
            correlationError,
            onClose,
            onGenerateReport,
            securityReportLoading
        }) {

            if (!show) {
                return null;
            }

            if (!device) {
                return null;
            }

            const riskScore =
                Number(device.deviceRiskScore || 0);

            const riskLevel =
                device.deviceRiskLevel ||
                (
                    riskScore >= 80
                        ? "Critical"
                        : riskScore >= 60
                            ? "High"
                            : riskScore >= 40
                                ? "Medium"
                                : "Low"
                );

            const riskColor =
                riskScore >= 80
                    ? "#C62828"
                    : riskScore >= 60
                        ? "#EF6C00"
                        : riskScore >= 40
                            ? "#F9A825"
                            : "#43A047";


            const normalizeList = (value) => {

                if (Array.isArray(value)) {
                    return value
                        .filter(Boolean)
                        .map(item => String(item).trim())
                        .filter(item => item && item !== "-");
                }

                if (typeof value === "string") {

                    return value
                        .split(/[,;|]/)
                        .map(item => item.trim())
                        .filter(item => item && item !== "-");

                }

                if (value !== undefined && value !== null) {
                    return [String(value)];
                }

                return [];
            };


            const openPorts =
                normalizeList(device.openPorts);

            const portDetails =
                Array.isArray(device.portDetails)
                    ? device.portDetails
                    : [];

            const services =
                normalizeList(device.services);

            const portServiceMap = {
                "21": "FTP",
                "22": "SSH",
                "23": "Telnet",
                "25": "SMTP",
                "53": "DNS",
                "80": "HTTP",
                "110": "POP3",
                "143": "IMAP",
                "443": "HTTPS",
                "445": "SMB",
                "554": "RTSP",
                "631": "IPP",
                "3389": "RDP",
                "5900": "VNC",
                "8080": "HTTP Alternate",
                "8443": "HTTPS Alternate",
                "1900": "UPnP"
            };

            const portServices = openPorts
                .map(port => portServiceMap[port])
                .filter(Boolean);

            const detectedServices = [
                ...services,
                ...portServices,

                device.httpBannerDetected
                    ? `${device.httpScheme || "HTTP"} Web Interface`
                    : null,

                device.sshBannerDetected
                    ? "SSH"
                    : null,

                device.snmpEnabled
                    ? "SNMP"
                    : null
            ].filter(Boolean);


            const uniqueServices =
                [...new Set(detectedServices)];


            const findings =
                Array.isArray(device.deviceRiskReasons)
                    ? device.deviceRiskReasons
                    : [];


            const getFindingText = (finding) => {

                if (typeof finding === "string") {
                    return finding;
                }

                return (
                    finding?.text ||
                    finding?.message ||
                    finding?.reason ||
                    "Security finding detected"
                );

            };


            const getFindingIcon = (finding) => {

                if (typeof finding === "object" && finding?.icon) {
                    return finding.icon;
                }

                return "⚠️";

            };


            return (

                <div
                    className="security-analysis-overlay"
                    onClick={onClose}
                >

                    <div
                        className="security-analysis-content"
                        onClick={(e) => e.stopPropagation()}
                    >

                            <div>

                                    style={{
                                        marginTop: "5px",
                                        color: "#666",
                                        fontSize: "13px"
                                    }}
                                >
                                    Device security posture and exposure analysis
                                </div>

                            </div>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>


                        <hr className="divider" />


                        {/* DEVICE INFORMATION */}

                        <h3 style={styles.sectionTitle}>
                            🖥️ Device Information
                        </h3>

                        <table style={styles.infoTable}>

                            <tbody>

                                <tr>

                                    <td style={styles.infoLabel}>
                                        Endpoint ID
                                    </td>

                                    <td style={styles.infoValue}>
                                        {device.endpointId || "-"}
                                    </td>

                                    <td style={styles.infoLabel}>
                                        Hostname
                                    </td>

                                    <td style={styles.infoValue}>
                                        {device.hostname || "-"}
                                    </td>

                                </tr>

                                <tr>

                                    <td style={styles.infoLabel}>
                                        IP Address
                                    </td>

                                    <td style={styles.infoValue}>
                                        {device.ip || "-"}
                                    </td>

                                    <td style={styles.infoLabel}>
