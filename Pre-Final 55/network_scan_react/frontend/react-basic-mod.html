                                                : "Not Detected"}
                                        </td>

                                    </tr>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            SSH
                                        </td>

                                        <td style={styles.infoValue}>
                                            {device.sshBannerDetected
                                                ? "Detected"
                                                : "Not Detected"}
                                        </td>

                                    </tr>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            SNMP
                                        </td>

                                        <td style={styles.infoValue}>
                                            {device.snmpEnabled
                                                ? "Enabled / Detected"
                                                : "Not Detected"}
                                        </td>

                                    </tr>

                                </tbody>

                            </table>
                        </div>

                        <div
                            style={{
                                display: "flex",
                                justifyContent: "space-between",
                                alignItems: "center",
                                marginTop: "20px"
                            }}
                        >

                            <button
                                className="btn"
                                onClick={onGenerateReport}
                                disabled={
                                    securityReportLoading ||
                                    !correlation
                                }
                            >
                                {securityReportLoading
                                    ? "⏳ Generating Report..."
                                    : "📄 Generate Security Report"}
                            </button>

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        });

        const SecurityReportModal = React.memo(function SecurityReportModal({
            show,
            report,
            loading,
            error,
            onClose
        }) {

            if (!show) {
                return null;
            }

            if (loading) {

                return (
                    <div className="security-report-overlay">

                        <div
                            className="security-report-content"
                            onClick={(e) => e.stopPropagation()}
                        >

                            <h2>
                                📄 Security Report
                            </h2>

                            <div style={styles.centerMessage}>
                                ⏳ Generating Security Report...
                            </div>

                        </div>

                    </div>
                );
            }

            if (error) {

                return (
                    <div className="security-report-overlay">

                        <div
                            className="security-report-content"
                            onClick={(e) => e.stopPropagation()}
                        >

                            <div style={styles.modalHeader}>

                                <h2>
                                    📄 Security Report
                                </h2>

                                <button
                                    onClick={onClose}
                                    style={styles.closeButton}
                                >
                                    ✕
                                </button>

                            </div>

                            <hr className="divider" />

                            <div
                                style={{
                                    padding: "20px",
                                    color: "#C62828",
                                    fontWeight: "600"
                                }}
                            >
                                ❌ {error}
                            </div>

                            <div style={styles.modalFooter}>

                                <button
                                    className="btn"
                                    onClick={onClose}
                                >
                                    Close
                                </button>

                            </div>

                        </div>

                    </div>
                );
            }

            if (!report || !report.report) {
                return null;
            }

            const data = report.report;

            const recommendations =
                Array.isArray(data.recommendations)
                    ? data.recommendations
                    : [];

            const device =
                data.device || {};

            const securityPosture =
                data.securityPosture || {};

            const exposure =
                data.exposure || {};

            const securityControls =
                data.securityControls || {};

            const correlation =
                data.trafficCorrelation || {};

            const findings =
                Array.isArray(correlation.findings)
                    ? correlation.findings
                    : [];

            const protocols =
                Array.isArray(correlation.protocols)
                    ? correlation.protocols
                    : [];

            const observedPorts =
                Array.isArray(correlation.observedPorts)
                    ? correlation.observedPorts
                    : [];

            const topRemoteHosts =
                Array.isArray(correlation.topRemoteHosts)
                    ? correlation.topRemoteHosts
                    : [];

            const portDetails =
                Array.isArray(exposure.portDetails)
                    ? exposure.portDetails
                    : [];

            const riskScore =
                Number(
                    securityPosture.deviceRiskScore || 0
                );

            const riskLevel =
                securityPosture.deviceRiskLevel ||
                "Low";

            const riskColor =
                riskScore >= 80
                    ? "#C62828"
                    : riskScore >= 60
                        ? "#EF6C00"
                        : riskScore >= 40
                            ? "#F9A825"
                            : "#43A047";

            return (

                <div
                    className="security-report-overlay"
                    onClick={onClose}
                >

                    <div
                        className="security-report-content"
                        onClick={(e) => e.stopPropagation()}
                    >

                        {/* HEADER */}

                        <div style={styles.modalHeader}>

                            <div>

                                <h2>
                                    📄 Security Report
                                </h2>

                                <div
                                    style={{
                                        color: "#666",
                                        fontSize: "13px"
                                    }}
                                >
                                    {data.reportType || "Device Security Report"}
                                </div>

                            </div>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        {/* REPORT INFORMATION */}

                        <h3 style={styles.sectionTitle}>
                            📋 Report Information
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                padding: "15px",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.infoTable}>

                                <tbody>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            Report Type
                                        </td>

                                        <td style={styles.infoValue}>
                                            {data.reportType || "-"}
                                        </td>

                                        <td style={styles.infoLabel}>
                                            Generated At
                                        </td>

                                        <td style={styles.infoValue}>
                                            {data.generatedAt || "-"}
                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        {/* DEVICE INFORMATION */}

                        <h3 style={styles.sectionTitle}>
                            🖥 Device Information
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                padding: "15px",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.infoTable}>

                                <tbody>

                                    <tr>
                                        <td style={styles.infoLabel}>
                                            Endpoint ID
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.endpointId || "-"}
                                        </td>

                                        <td style={styles.infoLabel}>
                                            Hostname
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.hostname || "-"}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td style={styles.infoLabel}>
                                            IP Address
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.ip || "-"}
                                        </td>

                                        <td style={styles.infoLabel}>
                                            MAC Address
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.mac || "-"}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td style={styles.infoLabel}>
                                            Manufacturer
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.manufacturer || "-"}
                                        </td>

                                        <td style={styles.infoLabel}>
                                            Model
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.model || "-"}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td style={styles.infoLabel}>
                                            Operating System
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.operatingSystem || "-"}
                                        </td>

                                        <td style={styles.infoLabel}>
                                            Connection Type
                                        </td>
                                        <td style={styles.infoValue}>
                                            {device.connectionType || "-"}
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        {/* SECURITY POSTURE */}

                        <h3 style={styles.sectionTitle}>
                            🛡 Security Posture
                        </h3>

                        <div
                            style={{
                                display: "grid",
                                gridTemplateColumns:
                                    "repeat(3, 1fr)",
                                gap: "12px",
                                marginBottom: "25px"
                            }}
                        >

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Device Risk Score
                                </div>

                                <div
                                    style={{
                                        ...styles.summaryValue,
                                        color: riskColor
                                    }}
                                >
                                    {riskScore}/100
                                </div>

                            </div>

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Risk Level
                                </div>

                                <div
                                    style={{
                                        ...styles.summaryValue,
                                        color: riskColor,
                                        fontSize: "20px"
                                    }}
                                >
                                    {riskLevel}
                                </div>

                            </div>

                            <div style={styles.summaryCard}>

                                <div style={styles.summaryTitle}>
                                    Correlation Risk
                                </div>

                                <div
                                    style={{
                                        ...styles.summaryValue,
                                        color:
                                            correlation.correlationRiskScore >= 80
                                                ? "#C62828"
                                                : correlation.correlationRiskScore >= 60
                                                    ? "#EF6C00"
                                                    : correlation.correlationRiskScore >= 40
                                                        ? "#F9A825"
                                                        : "#43A047"
                                    }}
                                >
                                    {correlation.correlationRiskScore || 0}/100
                                </div>

                            </div>

                        </div>

                        {/* RECOMMENDATIONS */}

                        <h3 style={styles.sectionTitle}>
                            💡 Security Recommendations
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                padding: "15px",
                                marginBottom: "25px",
                                background: "#FFFFFF"
                            }}
                        >
                            {recommendations.length === 0 ? (
                                <div
                                    style={{
                                        padding: "18px",
                                        textAlign: "center",
                                        color: "#666"
                                    }}
                                >
                                    No additional recommendations available.
                                </div>
                            ) : (
                                <table style={styles.tableFullWidth}>
                                    <thead>
                                        <tr>
                                            <th
                                                style={{
                                                    ...styles.tableHeaderCell,
                                                    width: "8%",
                                                    textAlign: "center"
                                                }}
                                            >
                                                #
                                            </th>

                                            <th
                                                style={{
                                                    ...styles.tableHeaderCell,
                                                    width: "15%",
                                                    textAlign: "center"
                                                }}
                                            >
                                                Priority
                                            </th>

                                            <th
                                                style={{
                                                    ...styles.tableHeaderCell,
                                                    width: "27%",
                                                    textAlign: "left"
                                                }}
                                            >
                                                Recommendation
                                            </th>

                                            <th
                                                style={{
                                                    ...styles.tableHeaderCell,
                                                    width: "50%",
                                                    textAlign: "left"
                                                }}
                                            >
                                                Details
                                            </th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        {recommendations.map(
                                            (item, index) => {

                                                const priority =
                                                    item.priority || "Low";

                                                const priorityColor =
                                                    priority === "Critical"
                                                        ? "#C62828"
                                                        : priority === "High"
                                                            ? "#EF6C00"
                                                            : priority === "Medium"
                                                                ? "#F9A825"
                                                                : "#2E7D32";

                                                return (
                                                    <tr key={index}>

                                                        <td
                                                            style={{
                                                                ...styles.tableCell,
                                                                textAlign: "center"
                                                            }}
                                                        >
                                                            {index + 1}
                                                        </td>

                                                        <td
                                                            style={{
                                                                ...styles.tableCell,
                                                                textAlign: "center",
                                                                fontWeight: "700",
                                                                color: priorityColor
                                                            }}
                                                        >
                                                            {priority}
                                                        </td>

                                                        <td
                                                            style={{
                                                                ...styles.tableCell,
                                                                fontWeight: "600"
                                                            }}
                                                        >
                                                            {item.title || "-"}
                                                        </td>

                                                        <td style={styles.tableCell}>
                                                            {item.detail || "-"}
                                                        </td>

                                                    </tr>
                                                );
                                            }
                                        )}
                                    </tbody>
                                </table>
                            )}
                        </div>

                        {/* SECURITY FINDINGS */}

                        <h3 style={styles.sectionTitle}>
                            🔎 Security Findings
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                overflow: "hidden",
                                marginBottom: "25px"
                            }}
                        >

                            {findings.length === 0 ? (

                                <div
                                    style={{
                                        padding: "18px",
                                        textAlign: "center",
                                        color: "#666"
                                    }}
                                >
                                    ✅ No security findings detected.
                                </div>

                            ) : (

                                <table style={styles.tableFullWidth}>

                                    <thead>

                                        <tr>

                                            <th style={styles.tableHeaderCell}>
                                                #
                                            </th>

                                            <th style={styles.tableHeaderCell}>
                                                Severity
                                            </th>

                                            <th style={styles.tableHeaderCell}>
                                                Finding
                                            </th>

                                            <th style={styles.tableHeaderCell}>
                                                Details
                                            </th>

                                        </tr>

                                    </thead>

                                    <tbody>

                                        {findings.map(
                                            (finding, index) => (

                                                <tr key={index}>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {index + 1}
                                                    </td>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            fontWeight: "700",
                                                            color:
                                                                finding.severity === "High"
                                                                    ? "#C62828"
                                                                    : finding.severity === "Medium"
                                                                        ? "#EF6C00"
                                                                        : "#2E7D32"
                                                        }}
                                                    >
                                                        {finding.severity || "-"}
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {finding.title || "-"}
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {finding.detail || "-"}
                                                    </td>

                                                </tr>

                                            )
                                        )}

                                    </tbody>

                                </table>

                            )}

                        </div>

                        {/* EXPOSURE */}

                        <h3 style={styles.sectionTitle}>
                            🔓 Exposed Ports & Services
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                padding: "15px",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.tableFullWidth}>

                                <thead>

                                    <tr>
                                        <th style={styles.tableHeaderCell}>
                                            Port
                                        </th>
                                        <th style={styles.tableHeaderCell}>
                                            Protocol
                                        </th>
                                        <th style={styles.tableHeaderCell}>
                                            Service
                                        </th>
                                        <th style={styles.tableHeaderCell}>
                                            Product
                                        </th>
                                        <th style={styles.tableHeaderCell}>
                                            Version
                                        </th>
                                    </tr>

                                </thead>

                                <tbody>

                                    {portDetails.length > 0
                                        ? portDetails.map(
                                            (item, index) => (

                                                <tr key={index}>

                                                    <td style={styles.tableCell}>
                                                        {item.port || "-"}
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {
                                                            (
                                                                item.protocol || "-"
                                                            ).toUpperCase()
                                                        }
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {item.service || "-"}
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {item.product || "-"}
                                                    </td>

                                                    <td style={styles.tableCell}>
                                                        {item.version || "-"}
                                                    </td>

                                                </tr>

                                            )
                                        )
                                        : (
                                            <tr>

                                                <td
                                                    colSpan="5"
                                                    style={{
                                                        ...styles.tableCell,
                                                        textAlign: "center",
                                                        color: "#666"
                                                    }}
                                                >
                                                    No open ports reported.
                                                </td>

                                            </tr>
                                        )
                                    }

                                </tbody>

                            </table>

                        </div>

                        {/* SECURITY CONTROLS */}

                        <h3 style={styles.sectionTitle}>
                            🔐 Detected Security Controls / Access
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                padding: "15px",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.infoTable}>

                                <tbody>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            HTTP/HTTPS
                                        </td>

                                        <td style={styles.infoValue}>
                                            {
                                                securityControls.httpHttps?.detected
                                                    ? (
                                                        securityControls.httpHttps.scheme ||
                                                        "Detected"
                                                    )
                                                    : "Not Detected"
                                            }
                                        </td>

                                    </tr>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            SSH
                                        </td>

                                        <td style={styles.infoValue}>
                                            {
                                                securityControls.ssh?.detected
                                                    ? "Detected"
                                                    : "Not Detected"
                                            }
                                        </td>

                                    </tr>

                                    <tr>

                                        <td style={styles.infoLabel}>
                                            SNMP
                                        </td>

                                        <td style={styles.infoValue}>
                                            {
                                                securityControls.snmp?.detected
                                                    ? "Enabled / Detected"
                                                    : "Not Detected"
                                            }
                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        {/* TRAFFIC CORRELATION */}

                        <h3 style={styles.sectionTitle}>
                            🔗 Traffic Correlation
                        </h3>

                        <div
                            style={{
                                display: "grid",
                                gridTemplateColumns:
                                    "repeat(4, 1fr)",
                                gap: "12px",
                                marginBottom: "25px"
                            }}
                        >

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Related Packets
                                </div>
                                <div style={styles.summaryValue}>
                                    {correlation.packetCount || 0}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Suspicious Packets
                                </div>
                                <div style={styles.summaryValue}>
                                    {correlation.suspiciousPacketCount || 0}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    External Packets
                                </div>
                                <div style={styles.summaryValue}>
                                    {correlation.externalPacketCount || 0}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Avg Packet Risk
                                </div>
                                <div style={styles.summaryValue}>
                                    {correlation.averagePacketRisk || 0}
                                </div>
                            </div>

                        </div>

                        {/* PROTOCOL ACTIVITY */}

                        <h3 style={styles.sectionTitle}>
                            📡 Observed Protocol Activity
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                overflow: "hidden",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.tableFullWidth}>

                                <thead>

                                    <tr>
                                        <th style={styles.tableHeaderCell}>
                                            Protocol
                                        </th>

                                        <th style={styles.tableHeaderCell}>
                                            Packets
                                        </th>

                                    </tr>

                                </thead>

                                <tbody>

                                    {protocols.length === 0 ? (

                                        <tr>
                                            <td
                                                colSpan="2"
                                                style={{
                                                    ...styles.tableCell,
                                                    textAlign: "center"
                                                }}
                                            >
                                                No protocol activity detected.
                                            </td>
                                        </tr>

                                    ) : (

                                        protocols.map(
                                            (item, index) => (

                                                <tr key={index}>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {item.name || "-"}
                                                    </td>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {item.count || 0}
                                                    </td>

                                                </tr>

                                            )
                                        )

                                    )}

                                </tbody>

                            </table>

                        </div>

                        {/* OBSERVED PORTS */}

                        <h3 style={styles.sectionTitle}>
                            🔌 Observed Traffic Ports
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                overflow: "hidden",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.tableFullWidth}>

                                <thead>

                                    <tr>
                                        <th style={styles.tableHeaderCell}>
                                            Port
                                        </th>

                                        <th style={styles.tableHeaderCell}>
                                            Packets
                                        </th>

                                        <th style={styles.tableHeaderCell}>
                                            Open
                                        </th>
                                    </tr>

                                </thead>

                                <tbody>

                                    {observedPorts.length === 0 ? (

                                        <tr>
                                            <td
                                                colSpan="3"
                                                style={{
                                                    ...styles.tableCell,
                                                    textAlign: "center"
                                                }}
                                            >
                                                No observed ports.
                                            </td>
                                        </tr>

                                    ) : (

                                        observedPorts.map(
                                            (item, index) => (

                                                <tr key={index}>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {item.port || "-"}
                                                    </td>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {item.count || 0}
                                                    </td>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {item.isOpen
                                                            ? "Yes"
                                                            : "No"}
                                                    </td>

                                                </tr>

                                            )
                                        )

                                    )}

                                </tbody>

                            </table>

                        </div>

                        {/* TOP REMOTE HOSTS */}

                        <h3 style={styles.sectionTitle}>
                            🌐 Top Remote Hosts
                        </h3>

                        <div
                            style={{
                                border: "1px solid #DDDDDD",
                                borderRadius: "8px",
                                overflow: "hidden",
                                marginBottom: "25px"
                            }}
                        >

                            <table style={styles.tableFullWidth}>

                                <thead>

                                    <tr>
                                        <th style={styles.tableHeaderCell}>
                                            #
                                        </th>

                                        <th style={styles.tableHeaderCell}>
                                            Remote Host
                                        </th>

                                        <th style={styles.tableHeaderCell}>
                                            Packets
                                        </th>
                                    </tr>

                                </thead>

                                <tbody>

                                    {topRemoteHosts.length === 0 ? (

                                        <tr>

                                            <td
                                                colSpan="3"
                                                style={{
                                                    ...styles.tableCell,
                                                    textAlign: "center"
                                                }}
                                            >
                                                No remote hosts observed.
                                            </td>

                                        </tr>

                                    ) : (

                                        topRemoteHosts.map(
                                            (item, index) => (

                                                <tr key={index}>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            textAlign: "center"
                                                        }}
                                                    >
                                                        {index + 1}
                                                    </td>

                                                    <td
                                                        style={{
                                                            ...styles.tableCell,
                                                            fontFamily: "Consolas"
                                                        }}
                                                    >
                                                        {item.host || "-"}
                                                    </td>

                if (!alertSoundEnabled) {
                    return;

                try {

                    if (!alertAudioContextRef.current) {

                        alertAudioContextRef.current =
                            new (
                                window.AudioContext ||
                                window.webkitAudioContext
                            )();
                    }

                    const audioContext =
                        alertAudioContextRef.current;

                    if (audioContext.state === "suspended") {
                        audioContext.resume();
                    }

                    const oscillator =
                        audioContext.createOscillator();

                    const gainNode =
                        audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    const normalizedSeverity =
                        String(severity || "")
                            .toUpperCase();

                    oscillator.frequency.value =
                        normalizedSeverity === "CRITICAL"
                            ? 900
                            : normalizedSeverity === "HIGH"
                                ? 700
                                : 500;

                    oscillator.type = "sine";

                    gainNode.gain.setValueAtTime(
                        0.15,
                        audioContext.currentTime
                    );

                    gainNode.gain.exponentialRampToValueAtTime(
                        0.001,
                        audioContext.currentTime + 0.5
                    );

                    oscillator.start();

                    oscillator.stop(
                        audioContext.currentTime + 0.5
                    );

                } catch (error) {

                    console.error(

            const normalizeDeepAnalysisList = (value) => {

                if (Array.isArray(value)) {
                    return value;
                }

                if (value === null || value === undefined || value === "") {
                    return [];
                }

                if (typeof value === "string") {

                    const text = value.trim();

                    if (!text) {
                        return [];
                    }

                    try {
                        const parsed = JSON.parse(text);

                        if (Array.isArray(parsed)) {
                            return parsed;
                        }
                    } catch (e) {
                        // Not JSON - treat as a single observation/recommendation
                    }

                    return [text];
                }

                if (typeof value === "object") {

                    return Object.entries(value).map(
                        ([key, item]) => {

                            if (
                                typeof item === "string" ||
                                typeof item === "number" ||
                                typeof item === "boolean"
                            ) {
                                return `${key}: ${item}`;
                            }

                            return `${key}: ${JSON.stringify(item)}`;
                        }
                    );
                }

                return [String(value)];
            };

                        else {
                            summary.counts.UNKNOWN =
                                (summary.counts.UNKNOWN || 0) + 1;
                        }
                        return;
                    }

                    // TCP
                    if (transportFilter === "TCP") {
                        if (transport !== "TCP")
                            return;
                        summary.total++;
                        summary.counts[protocol] =
                            (summary.counts[protocol] || 0) + 1;
                        return;
                    }

                    // UDP
                    if (transportFilter === "UDP") {
                        if (transport !== "UDP")
                            return;
                        summary.total++;
                        summary.counts[protocol] =
                            (summary.counts[protocol] || 0) + 1;
                        return;
                    }

                    // UNKNOWN
                    if (transportFilter === "UNKNOWN") {
                        if (
                            transport === "TCP" ||
                            transport === "UDP"
                        )
                            return;
                        summary.total++;
                        summary.counts[protocol] =
                            (summary.counts[protocol] || 0) + 1;
                    }
                });

                return summary;

                setDeviceAIResult(null);
                setDeviceAIError("");

                        `${API_BASE_URL}/device-ai-analysis`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(device)
                        }
                    );

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const retryAfter = response.headers.get("Retry-After");

                        const message =
                            errorData.message ||
                            `Device AI analysis failed (HTTP ${response.status}).`;

                        throw new Error(
                            response.status === 429
                                ? `${message}${retryAfter
                                    ? ` Retry after ${retryAfter} seconds.`
                                    : ""}`
                                : message
                        );
                    }

                    const result = await response.json();

                    setDeviceAIResult(result);

                    setDeviceAIError(error.message);

                }
                finally {

            }

                    );

                    setBatchAIError(

                        "Unable to perform batch AI analysis."
                    );

                }
                finally {

                    setBatchAILoading(false);

                }
