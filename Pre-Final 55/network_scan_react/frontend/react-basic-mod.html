                                                            value == null ||
                                                            value === "" ||
                                                            !Number.isFinite(Number(value))
                                                        ) {
                                                            return false;
                                                        }

                                                        const number = Number(value);

                                                        return field !== "riskScore" ||
                                                            (number >= 0 && number <= 100);
                                                    };

                                                    const validA = isValidMetric(a, metric.field);
                                                    const validB = isValidMetric(b, metric.field);

                                                    return (
                                                        <tr key={metric.field}>
                                                            <td style={styles.tableCell}>{metric.label}</td>
                                                            <td style={styles.tableCell}>
                                                                {validA ? metric.format(a) : "-"}
                                                            </td>
                                                            <td style={styles.tableCell}>
                                                                {validB ? metric.format(b) : "-"}
                                                            </td>
                                                            <td style={styles.tableCell}>
                                                                {difference == null
                                                                    ? "-"
                                                                    : metric.field === "totalBytes"
                                                                        ? `${difference > 0 ? "+" : difference < 0 ? "-" : ""}${formatBytes(Math.abs(difference))}`
                                                                        : `${difference > 0 ? "+" : ""}${["totalPackets", "riskScore"].includes(metric.field)
                                                                            ? difference.toFixed(0)
                                                                            : difference.toFixed(2)
                                                                        }`}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                <h3
                                    id="scan-history-section"
                                    style={styles.sectionTitle}
                                >
                                    Scan History
                                </h3>

                                <div style={{ overflowX: "auto" }}>
                                    <table style={styles.tableFullWidth}>
                                        <thead>
                                            <tr>
                                                {[

        const TimeBasedTrendsModal = React.memo(function TimeBasedTrendsModal({
            show,
            packets,
            onClose
        }) {

            if (!show) {
                return null;
            }

            const trendMap = new Map();

            (packets || []).forEach(packet => {

                const timeValue = String(packet.time || "").trim();

                const match = timeValue.match(
                    /(\d{1,2}):(\d{2}):(\d{2})/
                );

                if (!match) {
                    return;
                }

                const hour = Number(match[1]);
                const minute = Number(match[2]);
                const second = Number(match[3]);

                if (
                    !Number.isFinite(hour) ||
                    !Number.isFinite(minute) ||
                    !Number.isFinite(second)
                ) {
                    return;
                }

                const secondsOfDay =
                    (hour * 3600) +
                    (minute * 60) +
                    second;

                if (!trendMap.has(secondsOfDay)) {
                    trendMap.set(secondsOfDay, {
                        seconds: secondsOfDay,
                        packets: 0,
                        bytes: 0
                    });
                }

                const bucket = trendMap.get(secondsOfDay);

                bucket.packets += 1;

                const packetLength = Number(packet.length);

                if (Number.isFinite(packetLength) && packetLength > 0) {
                    bucket.bytes += packetLength;
                }
            });

            const trendBuckets = Array.from(trendMap.values())
                .sort((a, b) => a.seconds - b.seconds);

            const formatTime = seconds => {

                const hour = Math.floor(seconds / 3600) % 24;
                const minute = Math.floor((seconds % 3600) / 60);
                const second = seconds % 60;

                return [
                    String(hour).padStart(2, "0"),
                    String(minute).padStart(2, "0"),
                    String(second).padStart(2, "0")
                ].join(":");
            };

            const formatBytes = bytes => {

                if (!Number.isFinite(bytes) || bytes <= 0) {
                    return "0 Bytes";
                }

                const units = [
                    "Bytes",
                    "KB",
                    "MB",
                    "GB",
                    "TB"
                ];

                let value = bytes;
                let index = 0;

                while (
                    value >= 1024 &&
                    index < units.length - 1
                ) {
                    value /= 1024;
                    index++;
                }

                return `${value.toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
            };

            const packetTrendData = trendBuckets.map(bucket => ({
                name: formatTime(bucket.seconds),
                count: bucket.packets
            }));

            const byteTrendData = trendBuckets.map(bucket => ({
                name: formatTime(bucket.seconds),
                count: bucket.bytes
            }));

            const totalPackets = trendBuckets.reduce(
                (sum, bucket) => sum + bucket.packets,
                0
            );

            const totalBytes = trendBuckets.reduce(
                (sum, bucket) => sum + bucket.bytes,
                0
            );

            const peakPackets = trendBuckets.length
                ? Math.max(...trendBuckets.map(bucket => bucket.packets))
                : 0;

            const peakBytes = trendBuckets.length
                ? Math.max(...trendBuckets.map(bucket => bucket.bytes))
                : 0;

            let durationSeconds = 0;

            if (trendBuckets.length > 1) {

                durationSeconds =
                    trendBuckets[trendBuckets.length - 1].seconds -
                    trendBuckets[0].seconds;

                if (durationSeconds < 0) {
                    durationSeconds += 24 * 60 * 60;
                }
            }

            return (
                <div
                    className="modal-overlay"
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "1100px",
                            maxWidth: "95%",
                            maxHeight: "90vh",
                            overflowY: "auto"
                        }}
                        onClick={e => e.stopPropagation()}
                    >

                        <div style={styles.modalHeader}>

                            <h2>
                                📈 Time-based Traffic Trends
                            </h2>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <div
                            style={{
                                display: "grid",
                                gridTemplateColumns:
                                    "repeat(5, 1fr)",
                                gap: "12px",
                                marginTop: "20px"
                            }}
                        >

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Total Packets
                                </div>

                                <div style={styles.summaryValue}>
                                    {totalPackets.toLocaleString()}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Total Traffic
                                </div>

                                <div style={styles.summaryValue}>
                                    {formatBytes(totalBytes)}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Duration
                                </div>

                                <div style={styles.summaryValue}>
                                    {durationSeconds.toFixed(0)} sec
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Peak Packets/sec
                                </div>

                                <div style={styles.summaryValue}>
                                    {peakPackets.toLocaleString()}
                                </div>
                            </div>

                            <div style={styles.summaryCard}>
                                <div style={styles.summaryTitle}>
                                    Peak Bytes/sec
                                </div>

                                <div style={styles.summaryValue}>
                                    {formatBytes(peakBytes)}
                                </div>
                            </div>

                        </div>

                        {trendBuckets.length === 0 ? (

                            <div style={styles.centerMessage}>
                                No time-based traffic data available.
                            </div>

                        ) : (

                            <>

                                <h3
                                    style={{
                                        ...styles.sectionTitle,
                                        marginTop: "30px"
                                    }}
                                >
                                    📦 Packets per Second

                                <div

                                    <LineChart data={byteTrendData} />
                                </div>

                            </>
                        )}

                        <div style={styles.modalFooter}>

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>

                        </div>

                    </div>

                </div>
            );
        });

            riskLevel,

            linkConfidence,
            highlight,

            onClick,
            onContextMenu

                if (riskLevel === "Critical")
                    return "#FFEBEE";

                if (riskLevel === "High")
                    return "#FFF3E0";

                if (riskLevel === "Medium")
                    return "#FFFDE7";

                const type = (deviceType || "").toLowerCase();

                if (type.includes("gateway"))
                    return "#E3F2FD";

                if (type.includes("router"))
                    return "#E8EAF6";

                if (type.includes("switch"))
                    return "#F3E5F5";

                if (type.includes("access point"))
                    return "#E0F7FA";

                if (type.includes("server"))
                    return "#F1F8E9";

                if (type.includes("nas"))
                    return "#F1F8E9";

                if (type.includes("printer"))
                    return "#FCE4EC";

                if (type.includes("camera"))
                    return "#F3E5F5";

                if (type.includes("android"))
                    return "#E8F5E9";

                if (type.includes("iphone"))
                    return "#ECEFF1";

                if (type.includes("windows"))
                    return "#E3F2FD";

                if (type.includes("linux"))
                    return "#FFFDE7";

                return "#FFFFFF";

            })();

            const borderColor =
                riskLevel === "Critical"
                    ? "#C62828"

                            : "#43A047";

                        borderRadius: "8px",
                        padding: "12px",
                        textAlign: "center",
                        background: nodeBackground,
                        boxShadow:
                            highlight
                                ? "0 0 18px 4px rgba(255,193,7,0.9)"
                                : connectionType === "Wireless"
                                    ? "0 2px 12px rgba(21,101,192,0.35)"
                                    : "0 2px 8px rgba(0,0,0,0.15)",
                        cursor: "pointer",
                        transform: highlight ? "scale(1.05)" : "scale(1)",
                        transition: "all 0.25s ease"
                    }}
                >

                        {icon}

                            fontWeight: "700",
                            marginTop: "8px"

                                ? "🌐 Gateway"

                                    ? "📶 WiFi"
                                    : connectionType === "Switch"
                                        ? "🖧 Switch"
                                        : connectionType === "Wired"
                                            ? "🔌 Ethernet"
                                            : "❓ Unknown"
                        }
                    </div>
                    <div
                        style={{
                            marginTop: "6px",
                            fontWeight: "700",
                            color:
                                riskLevel === "Critical"
                                    ? "#C62828"
                                    : riskLevel === "High"
                                        ? "#EF6C00"
                                        : riskLevel === "Medium"
                                            ? "#F9A825"
                                            : "#2E7D32"
                        }}
                    >
                        {riskLevel || "Low"}
                    </div>
                    <div
                        style={{
                            marginTop: "6px"
                        }}
                    >
                        <div
                            style={{
                                height: "8px",
                                background: "#DDDDDD",
                                borderRadius: "5px",
                                overflow: "hidden"
                            }}
                        >
                            <div
                                style={{
                                    width: `${riskScore || 0}%`,
                                    height: "100%",
                                    background:
                                        riskScore >= 80
                                            ? "#C62828"
                                            : riskScore >= 60
                                                ? "#EF6C00"
                                                : riskScore >= 40
                                                    ? "#F9A825"
                                                    : "#43A047"
                                }}
                            />
                        </div>

                        <div
                            style={{
                                fontSize: "11px",
                                fontWeight: "700",
                                marginTop: "3px"
                            }}
                        >
                            {riskScore || 0}/100
                        </div>
                        <div
                            style={{
                                marginTop: "6px",
                                fontSize: "10px",
                                color: "#666666",
                                lineHeight: "14px",
                                minHeight: "28px"
                            }}
                        >
                            {riskReason || "No security findings"}
                        </div>
                    </div>
                    <div
                        style={{
                            marginTop: "6px",
                            fontSize: "12px",
                            fontWeight: "700",
                            color: status ? "#2E7D32" : "#C62828"
                        }}
                    >
                        {status ? "🟢 Online" : "🔴 Offline"}
                    </div>
                    <div
                        style={{
                            marginTop: "4px",
                            fontSize: "11px",
                            color: "#666666"
                        }}
                    >
                        <b>Last Seen</b><br />
                        {getLastSeen({
                            active: status,
                            lastSeen: linkConfidence
                        })}
                    </div>
                    <div
                        style={{
                            marginTop: "10px",
                            paddingTop: "8px",
                            borderTop: "1px solid #DDDDDD",
                            fontSize: "11px",
                            textAlign: "left",
                            color: "#555555"
                        }}
                    >

                        <div>
                            <b>Parent :</b> {parentName || "-"}
                        </div>

                        <div>
                            <b>Children :</b> {childCount || 0}
                        </div>

                        <div>
                            <b>Level :</b> {topologyLevel || "-"}
                        </div>

                        <div>
                            <b>Confidence :</b> {linkConfidence || "-"}
                        </div>

                    </div>
                </div>
            );
        });

        const LinkLabel = React.memo(function LinkLabel({ text, wireless = false }) {

            if (!text) return null;

            return (
                <div
                    style={{
                        margin: "4px 0",
                        padding: "2px 8px",
                        borderRadius: "10px",
                        fontSize: "11px",
                        fontWeight: "700",
                        color: wireless ? "#1565C0" : "#2E7D32",
                        background: wireless ? "#E3F2FD" : "#E8F5E9",
                        border: wireless
                            ? "1px dashed #1565C0"
                            : "1px solid #2E7D32"
                    }}
                >
                    {text}
                </div>
            );

        });

        function getDeviceIcon(deviceType) {

            const type = (deviceType || "").toLowerCase();

            if (type.includes("gateway")) return "🌐";
            if (type.includes("router")) return "📡";
            if (type.includes("switch")) return "🖧";
            if (type.includes("access point")) return "📶";
            if (type.includes("wireless")) return "📶";

            if (type.includes("printer")) return "🖨️";
            if (type.includes("camera")) return "📷";
            if (type.includes("nas")) return "💾";
            if (type.includes("storage")) return "💾";
            if (type.includes("server")) return "🖥️";

            if (type.includes("windows")) return "💻";
            if (type.includes("linux")) return "🐧";
            if (type.includes("mac")) return "🍎";

            if (type.includes("android")) return "📱";
            if (type.includes("iphone")) return "📱";
            if (type.includes("ios")) return "📱";
            if (type.includes("mobile")) return "📱";
            if (type.includes("tablet")) return "📱";

            if (type.includes("tv")) return "📺";
            if (type.includes("smart tv")) return "📺";
            if (type.includes("chromecast")) return "📺";
            if (type.includes("roku")) return "📺";
            if (type.includes("fire tv")) return "📺";
            if (type.includes("apple tv")) return "📺";

            if (type.includes("voip")) return "☎️";
            if (type.includes("phone")) return "☎️";

            if (type.includes("iot")) return "🔌";
            if (type.includes("sensor")) return "🌡️";

            return "🖥️";
        }

        function getDevicePriority(device) {

            const type = (device.deviceType || "").toLowerCase();

            if (type.includes("gateway")) return 1;
            if (type.includes("router")) return 2;
            if (type.includes("switch")) return 3;
            if (type.includes("access point")) return 4;

            if (type.includes("server")) return 5;
            if (type.includes("nas")) return 6;
            if (type.includes("storage")) return 6;

            if (type.includes("printer")) return 7;
            if (type.includes("camera")) return 8;

            if (type.includes("windows")) return 9;
            if (type.includes("linux")) return 9;
            if (type.includes("mac")) return 9;

            if (type.includes("android")) return 10;
            if (type.includes("iphone")) return 10;
            if (type.includes("ios")) return 10;

            if (type.includes("tv")) return 11;

            return 99;

        }

        function compareTopologyDevices(a, b) {

            const priorityDiff =
                getDevicePriority(a) - getDevicePriority(b);

            if (priorityDiff !== 0) {
                return priorityDiff;
            }

            return (a.hostname || a.ip || "")
                .localeCompare(b.hostname || b.ip || "");
        }

        function getLinkLabel(device) {

            if (!device)
                return "-";

            if (device.connectionType === "Wireless") {

                return (
                    device.wifiStandard ||
                    device.wifiGeneration ||
                    device.wifiProtocol ||
                    device.wifiBand ||
                    "WiFi"
                );
            }

            return (
                device.linkSpeed ||
                device.portSpeed ||
                device.interfaceSpeed ||
                device.interfaceName ||
                "Ethernet"
            );
        }

        function getLinkQuality(device) {

            if (!device)
                return {
                    text: "-",
                    color: "#666666"
                };

            const speed =
                (device.linkSpeed ||
                    device.portSpeed ||
                    device.interfaceSpeed ||
                    "").toString().toLowerCase();

            if (speed.includes("10 gb"))
                return { text: "★★★★★ Excellent", color: "#2E7D32" };

            if (speed.includes("1 gb"))
                return { text: "★★★★☆ Excellent", color: "#43A047" };

            if (speed.includes("100"))
                return { text: "★★★☆☆ Good", color: "#F9A825" };

            if (speed.includes("10"))
                return { text: "★★☆☆☆ Poor", color: "#EF6C00" };

            if (device.connectionType === "Wireless") {

                const wifi =
                    (
                        device.wifiStandard ||
                        device.wifiGeneration ||
                        ""
                    ).toLowerCase();

                if (wifi.includes("wifi 7"))
                    return { text: "★★★★★ Excellent", color: "#2E7D32" };

                if (wifi.includes("wifi 6"))
                    return { text: "★★★★☆ Excellent", color: "#43A047" };

                if (wifi.includes("802.11ac"))
                    return { text: "★★★☆☆ Good", color: "#F9A825" };

                if (wifi.includes("802.11n"))
                    return { text: "★★☆☆☆ Fair", color: "#EF6C00" };
            }

            return {
                text: "Unknown",
                color: "#666666"
            };
        }

        function getLinkColor(device) {

            const speed =
                (
                    device.linkSpeed ||
                    device.portSpeed ||
                    device.interfaceSpeed ||
                    ""
                ).toLowerCase();

            if (speed.includes("10 gb"))
                return "#2E7D32";

            if (speed.includes("1 gb"))
                return "#43A047";

            if (speed.includes("100"))
                return "#F9A825";

            if (speed.includes("10"))
                return "#C62828";

            if (device.connectionType === "Wireless")
                return "#1565C0";

            return "#777777";

        }

        function getConnectionDescription(device) {

            if (!device)
                return "-";

            if (device.connectionType === "Wireless") {

                return [
                    device.wifiStandard,
                    device.wifiBand,
                    device.channelWidth,
                    device.rssi && `RSSI ${device.rssi}`,
                    device.confidence && `Confidence ${device.confidence}`
                ]
                    .filter(Boolean)
                    .join(" • ");
            }

            return [
                device.linkSpeed,
                device.duplex,
                device.interfaceName,
                device.confidence && `Confidence ${device.confidence}`
            ]
                .filter(Boolean)
                .join(" • ");
        }

        function getLastSeen(device) {

            if (!device)
                return "-";

            if (device.active)
                return "Just Now";

            return (
                device.lastSeen ||
                device.lastSeenTime ||
                device.lastDiscovery ||
                "-"
            );
        }

        function getInterfaceName(device) {

            if (!device)
                return "-";

            return (
                device.interfaceName ||
                device.interface ||
                device.portName ||
                device.portId ||
                device.lldpPortId ||
                device.cdpPortId ||
                "Unknown Port"
            );

        }

        function formatDeviceType(deviceType) {

            if (!deviceType)
                return "-";

            if (deviceType.startsWith("urn:")) {

                const parts = deviceType.split(":");

                return parts[parts.length - 2]
                    .replace(/([a-z])([A-Z])/g, "$1 $2");
            }

            return deviceType;
        }

        function buildTopologyStatistics(topology) {

            const devices = topology?.devices || [];

            return {

                online:
                    devices.filter(d => d.active).length,

                offline:
                    devices.filter(d => !d.active).length,

                wired:
                    devices.filter(
                        d => d.connectionType === "Wired"
                    ).length,

                wireless:
                    devices.filter(
                        d => d.connectionType === "Wireless"
                    ).length,

                critical:
                    devices.filter(
                        d => d.deviceRiskLevel === "Critical"
                    ).length,

                high:
                    devices.filter(
                        d => d.deviceRiskLevel === "High"
                    ).length,

                medium:
                    devices.filter(
                        d => d.deviceRiskLevel === "Medium"
                    ).length,

                low:
                    devices.filter(
                        d =>
                            !d.deviceRiskLevel ||
                            d.deviceRiskLevel === "Low"
                    ).length

            };

        }

        const TopologyMiniMap = React.memo(function TopologyMiniMap({
            topology,
            selectedEndpoint,
            onNodeClick,
            viewport,
            onNavigate,
            onPan
        }) {

            const miniMapDragRef = React.useRef({
                dragging: false,
                moved: false,
                startX: 0,
                startY: 0
            });

            if (!topology) {
                return null;
            }

            function handleMiniMapClick(event) {

                if (miniMapDragRef.current.moved) {

                    miniMapDragRef.current.moved = false;

                    return;
                }

                const rect =
                    event.currentTarget.getBoundingClientRect();

                const x =
                    (event.clientX - rect.left) /
                    rect.width;

                const y =
                    (event.clientY - rect.top) /
                    rect.height;

                onNavigate(
                    Math.max(0, Math.min(1, x)),
                    Math.max(0, Math.min(1, y))
                );
            }

            function handleViewportPointerDown(event) {

                event.stopPropagation();

                miniMapDragRef.current = {
                    dragging: true,
                    moved: false,
                    startX: event.clientX,
                    startY: event.clientY
                };

                event.currentTarget.setPointerCapture(
                    event.pointerId
                );
            }

            function handleViewportPointerMove(event) {

                if (!miniMapDragRef.current.dragging)
                    return;

                const deltaX =
                    event.clientX -
                    miniMapDragRef.current.startX;

                const deltaY =
                    event.clientY -
                    miniMapDragRef.current.startY;

                if (
                    Math.abs(deltaX) > 2 ||
                    Math.abs(deltaY) > 2
                ) {
                    miniMapDragRef.current.moved = true;
                }

                if (!miniMapDragRef.current.moved)
                    return;

                miniMapDragRef.current.startX =
                    event.clientX;

                miniMapDragRef.current.startY =
                    event.clientY;

                onPan(
                    deltaX,
                    deltaY
                );
            }

            function handleViewportPointerUp(event) {

                miniMapDragRef.current.dragging = false;

                if (
                    event.currentTarget.hasPointerCapture(
                        event.pointerId
                    )
                ) {
                    event.currentTarget.releasePointerCapture(
                        event.pointerId
                    );
                }
            }

            const gateway = topology?.gateway || null;
            const devices = Array.isArray(topology?.devices)
                ? topology.devices
                : [];

            /*
            * Build unique node list.
            * Gateway is normally also present inside devices,
            * so avoid adding it twice.
            */
            const gatewayId = gateway?.endpointId;

            const nodes = [
                ...(gateway ? [gateway] : []),
                ...devices.filter(
                    device => device.endpointId !== gatewayId
                )
            ];

            if (!nodes.length) {
                return null;
            }

            /*
            * -------------------------------------------------------
            * Build parent -> children relationship
            * -------------------------------------------------------
            */

            const childrenMap = {};

            nodes.forEach(device => {

                const parentId = device.parentId;

                if (!parentId) {
                    return;
                }

                if (!childrenMap[parentId]) {
                    childrenMap[parentId] = [];
                }

                childrenMap[parentId].push(device);
            });

            /*
            * Keep Mini Map child ordering identical
            * to the Topology Tree ordering.
            */
            Object.keys(childrenMap).forEach(parentId => {
                childrenMap[parentId].sort(compareTopologyDevices);
            });

            /*
            * -------------------------------------------------------
            * Selected topology path
            * -------------------------------------------------------
            */

            const selectedPathIds = new Set();

            if (selectedEndpoint) {

                let current = nodes.find(
                    device =>
                        device.endpointId === selectedEndpoint
                );

                while (current) {

                    selectedPathIds.add(
                        current.endpointId
                    );

                    if (!current.parentId) {
                        break;
                    }

                    current = nodes.find(
                        device =>
                            device.endpointId === current.parentId
                    );
                }

                /*
                * Gateway may be outside topology.devices
                * but is still part of the selected path.
                */
                if (gateway?.endpointId) {
                    selectedPathIds.add(
                        gateway.endpointId
                    );
                }
            }

            /*
            * -------------------------------------------------------
            * Determine root nodes
            * -------------------------------------------------------
            */

            const nodeIds = new Set(
                nodes.map(device => device.endpointId)
            );

            const roots = nodes.filter(device =>
                !device.parentId ||
                !nodeIds.has(device.parentId)
            );

            /*
            * -------------------------------------------------------
            * Calculate tree depth
            * -------------------------------------------------------
            */

            const depthMap = {};

            function calculateDepth(device, depth, visited = new Set()) {

                if (!device || visited.has(device.endpointId)) {
                    return;
                }

                visited.add(device.endpointId);

                depthMap[device.endpointId] = depth;

                const children =
                    childrenMap[device.endpointId] || [];

                children.forEach(child => {
                    calculateDepth(
                        child,
                        depth + 1,
                        new Set(visited)
                    );
                });
            }

            roots.forEach(root => {
                calculateDepth(root, 0);
            });

            /*
            * -------------------------------------------------------
            * Assign X positions using leaf ordering
            * -------------------------------------------------------
            */

            const positions = {};
            let leafIndex = 0;

            function calculatePosition(device) {

                const children =
                    childrenMap[device.endpointId] || [];

                if (!children.length) {

                    positions[device.endpointId] = {
                        x: leafIndex,
                        y: depthMap[device.endpointId] || 0
                    };

                    leafIndex++;

                    return leafIndex - 1;
                }

                const childPositions = children.map(
                    child => calculatePosition(child)
                );

                const min = Math.min(...childPositions);
                const max = Math.max(...childPositions);

                const x = (min + max) / 2;

                positions[device.endpointId] = {
                    x,
                    y: depthMap[device.endpointId] || 0
                };

                return x;
            }

            roots.forEach(root => {
                calculatePosition(root);
            });

            /*
            * -------------------------------------------------------
            * Handle disconnected nodes
            * -------------------------------------------------------
            */

            nodes.forEach(device => {

                if (!positions[device.endpointId]) {

                    positions[device.endpointId] = {
                        x: leafIndex,
                        y: depthMap[device.endpointId] || 0
                    };

                    leafIndex++;
                }
            });

            /*
            * -------------------------------------------------------
            * Mini map dimensions
            * -------------------------------------------------------
            */

            const MINIMAP_WIDTH = 360;
            const MINIMAP_HEIGHT = 190;

            const HORIZONTAL_PADDING = 30;
            const VERTICAL_PADDING = 30;

            const NODE_RADIUS = 6;

            const maxX = Math.max(
                1,
                ...Object.values(positions).map(
                    position => position.x
                )
            );

            const maxY = Math.max(
                1,
                ...Object.values(positions).map(
                    position => position.y
                )
            );

            function getX(position) {

                return HORIZONTAL_PADDING +
                    (
                        position.x / maxX
                    ) *
                    (
                        MINIMAP_WIDTH -
                        HORIZONTAL_PADDING * 2
                    );
            }

            function getY(position) {

                return VERTICAL_PADDING +
                    (
                        position.y / maxY
                    ) *
                    (
                        MINIMAP_HEIGHT -
                        VERTICAL_PADDING * 2
                    );
            }

            /*
            * -------------------------------------------------------
            * Node colour
            * -------------------------------------------------------
            */

            function getNodeColor(device) {

                if (
                    selectedEndpoint &&
                    device.endpointId === selectedEndpoint
                ) {
                    return "#1565C0";
                }

                if (!device.active) {
                    return "#9E9E9E";
                }

                switch (device.topologyRole) {

                    case "Gateway":
                        return "#556B2F";

                    case "Switch":
                        return "#795548";

                    case "Access Point":
                        return "#1565C0";

                    default:
                        return "#2E7D32";
                }
            }

            /*
            * -------------------------------------------------------
            * Link colour
            * -------------------------------------------------------
            */

            function getMiniMapLinkColor(device) {

                if (
                    device.connectionType === "Wireless" ||
                    device.parentLinkType === "Wireless AP"
                ) {
                    return "#1565C0";
                }

                return "#556B2F";
            }

            /*
            * -------------------------------------------------------
            * Render links
            * -------------------------------------------------------
            */

            const links = [];

            nodes.forEach(device => {

                if (!device.parentId) {
                    return;
                }

                const parentPosition =
                    positions[device.parentId];

                const childPosition =
                    positions[device.endpointId];

                if (!parentPosition || !childPosition) {
                    return;
                }

                const parentSelected =
                    selectedPathIds.has(device.parentId);

                const childSelected =
                    selectedPathIds.has(device.endpointId);

                const pathSelected =
                    parentSelected && childSelected;

                links.push({

                    id:
                        `${device.parentId}-${device.endpointId}`,

                    x1: getX(parentPosition),
                    y1: getY(parentPosition),

                    x2: getX(childPosition),
                    y2: getY(childPosition),

                    color:
                        pathSelected
                            ? "#1565C0"
                            : getMiniMapLinkColor(device),

                    width:
                        pathSelected
                            ? 3.5
                            : 2,

                    wireless:
                        device.connectionType === "Wireless" ||
                        device.parentLinkType === "Wireless AP"

                });
            });

            return (
                <div
                    style={{
                        position: "absolute",
                        top: "100px",
                        right: "20px",
                        width: `${MINIMAP_WIDTH}px`,
                        background: "#FFFFFF",
                        border: "2px solid #556B2F",
                        borderRadius: "10px",
                        boxShadow:
                            "0 4px 14px rgba(0,0,0,0.25)",
                        zIndex: 1000,
                        overflow: "hidden"
                    }}
                >

                    {/* Mini Map Header */}

                    <div
                        style={{
                            padding: "8px 12px",
                            background: "#556B2F",
                            color: "#FFFFFF",
                            fontWeight: "700",
                            fontSize: "13px"
                        }}
                    >
                        🗺️ Network Mini Map
                        <span
                            style={{
                                float: "right",
                                fontSize: "11px",
                                fontWeight: "500",
                                opacity: 0.9
                            }}
                        >
                            {nodes.length} Devices
                        </span>
                    </div>

                    {/* Mini Map SVG */}

                    <svg
                        width={MINIMAP_WIDTH}
                        height={MINIMAP_HEIGHT}
                        viewBox={`0 0 ${MINIMAP_WIDTH} ${MINIMAP_HEIGHT}`}
                        onClick={handleMiniMapClick}
                        style={{
                            display: "block",
                            background: "#F8FAF5",
                            cursor: "crosshair"
                        }}
                    >

                        {/* Links */}

                        {links.map(link => (

                            <line
                                key={link.id}
                                x1={link.x1}
                                y1={link.y1}
                                x2={link.x2}
                                y2={link.y2}
                                stroke={link.color}
                                strokeWidth={link.width}
                                strokeDasharray={
                                    link.wireless
                                        ? "5,4"
                                        : undefined
                                }
                            />

                        ))}

                        {/* Viewport Rectangle */}

                        <rect
                            x={viewport.x}
                            y={viewport.y}
                            width={viewport.width}
                            height={viewport.height}
                            rx="4"
                            fill="rgba(85,107,47,0.08)"
                            stroke="#556B2F"
                            strokeWidth="2.5"
                            style={{
                                cursor:
                                    viewport.width < MINIMAP_WIDTH ||
                                        viewport.height < MINIMAP_HEIGHT
                                        ? "grab"
                                        : "default"
                            }}
                            onPointerDown={handleViewportPointerDown}
                            onPointerMove={handleViewportPointerMove}
                            onPointerUp={handleViewportPointerUp}
                            onPointerCancel={handleViewportPointerUp}
                        />

                        {/* Nodes */}

                        {nodes.map(device => {

                            const position =
                                positions[device.endpointId];

                            if (!position) {
                                return null;
                            }

                            const x = getX(position);
                            const y = getY(position);

                            const isSelected =
                                selectedEndpoint ===
                                device.endpointId;

                            const isPathNode =
                                selectedPathIds.has(
                                    device.endpointId
                                );

                            return (
                                <g
                                    key={device.endpointId}
                                    onClick={(event) => {

                                        event.stopPropagation();

                                        onNodeClick(device);

                                        onNavigate(
                                            x / MINIMAP_WIDTH,
                                            y / MINIMAP_HEIGHT
                                        );

                                    }}
                                    style={{
                                        cursor: "pointer"
                                    }}
                                >
                                    <title>
                                        {device.hostname ||
                                            device.ip ||
                                            "Device"}

                                        {"\n"}

                                        IP: {device.ip || "-"}

                                        {"\n"}

                                        MAC: {device.mac || "-"}

                                        {"\n"}

                                        Type: {device.deviceType || "-"}

                                        {"\n"}

                                        Connection: {device.connectionType || "-"}

                                        {"\n"}

                                        Status: {device.active ? "Online" : "Offline"}
                                    </title>

                                    {/* Selection halo */}

                                    {isSelected && (
                                        <>
                                            <circle
                                                cx={x}
                                                cy={y}
                                                r="11"
                                                fill="none"
                                                stroke="#1565C0"
                                                strokeWidth="2.5"
                                            />

                                            <circle
                                                cx={x}
                                                cy={y}
                                                r="4"
                                                fill="#1565C0"
                                            />
                                        </>
                                    )}

                                    {/* Node */}

                                    <circle
                                        cx={x}
                                        cy={y}
                                        r={NODE_RADIUS}
                                        fill={
                                            isSelected
                                                ? "#1565C0"
                                                : isPathNode
                                                    ? "#42A5F5"
                                                    : getNodeColor(device)
                                        }
                                        stroke="#FFFFFF"
                                        strokeWidth="1.5"
                                    />

                                    {/* Device icon */}

                                    <text
                                        x={x}
                                        y={y - 10}
                                        textAnchor="middle"
                                        fontSize="9"
                                    >
                                        {getDeviceIcon(
                                            device.deviceType
                                        )}
                                    </text>

                                    {/* Device name */}

                                    <text
                                        x={x}
                                        y={y + 17}
                                        textAnchor="middle"
                                        fontSize="7"
                                        fontWeight={
                                            isSelected || isPathNode
                                                ? "700"
                                                : "400"
                                        }
                                        fill={
                                            isSelected || isPathNode
                                                ? "#1565C0"
                                                : "#333333"
                                        }
                                    >
                                        {
                                            (
                                                device.hostname ||
                                                device.ip ||
                                                "Device"
                                            ).length > 12
                                                ?
                                                (
                                                    device.hostname ||
                                                    device.ip ||
                                                    "Device"
                                                ).substring(0, 10) + "…"
                                                :
                                                (
                                                    device.hostname ||
                                                    device.ip ||
                                                    "Device"
                                                )
                                        }
                                    </text>

                                </g>
                            );

                        })}

                    </svg>

                    {/* Legend */}

                    <div
                        style={{
                            display: "flex",
                            gap: "12px",
                            padding: "6px 10px",
                            borderTop:
                                "1px solid #DDDDDD",
                            fontSize: "10px",
                            color: "#555",
                            flexWrap: "wrap"
                        }}
                    >

                        <span>
                            <span
                                style={{
                                    display: "inline-block",
                                    width: "8px",
                                    height: "8px",
                                    borderRadius: "50%",
                                    background: "#556B2F",
                                    marginRight: "4px"
                                }}
                            />
                            Gateway
                        </span>

                        <span>
                            <span
                                style={{
                                    display: "inline-block",
                                    width: "8px",
                                    height: "8px",
                                    borderRadius: "50%",
                                    background: "#795548",
                                    marginRight: "4px"
                                }}
                            />
                            Switch
                        </span>

                        <span>
                            <span
                                style={{
                                    display: "inline-block",
                                    width: "8px",
                                    height: "8px",
                                    borderRadius: "50%",
                                    background: "#2E7D32",
                                    marginRight: "4px"
                                }}
                            />
                            Endpoint
                        </span>

                    </div>

                </div>
            );
        });

        const TopologyModal = React.memo(function TopologyModal({

            show,
            topology,
            packets,
            animatedPacketIds,
            animationCycle,
            loading,

            zoom,
            setZoom,

            onClose,
            onNodeClick,
            onDeviceDetails,
            onSecurityAnalysis

        }) {

            if (!show) { return null; }

            function getChildren(parentId) {

                return (topology?.devices || []).filter(
                    device => device.parentId === parentId
                );

            }

            function getBranchWidth(endpointId) {

                const children = getChildren(endpointId);

                if (children.length === 0) {
                    return NODE_WIDTH;
                }

                return Math.max(
                    children.reduce(
                        (total, child) => total + getBranchWidth(child.endpointId),
                        0
                    ),
                    NODE_WIDTH
                );

            }

            function getLinkPacketFlows(childDevice) {

                if (
                    !childDevice ||
                    !childDevice.parentId
                ) {
                    return {
                        forward: [],
                        reverse: []
                    };
                }

                const nodeMap =
                    getTopologyNodeMap();

                const parentDevice =
                    nodeMap.get(
                        childDevice.parentId
                    );

                if (!parentDevice) {
                    return {
                        forward: [],
                        reverse: []
                    };
                }

                const forward = [];
                const reverse = [];

                /*
                * Only the packets selected by loadPackets()
                * are animated.
                */
                const packetsToAnimate =
                    (packets || []).filter(packet => {

                        const packetId =
                            packet?.id ??
                            packet?.number;

                        return (
                            packetId !== undefined &&
                            packetId !== null &&
                            animatedPacketIds.has(
                                String(packetId)
                            )
                        );
                    });


                packetsToAnimate.forEach(packet => {

                    const sourceDevice =
                        findTopologyDeviceByIP(
                            nodeMap,
                            packet?.source
                        );

                    const destinationDevice =
                        findTopologyDeviceByIP(
                            nodeMap,
                            packet?.destination
                        );


                    /*
                    * -------------------------------------------------
                    * CASE 1
                    *
                    * Child -> Parent
                    *
                    * Example:
                    *
                    * PC -> Gateway
                    *
                    * -------------------------------------------------
                    */
                    if (
                        sourceDevice &&
                        sourceDevice.endpointId ===
                        childDevice.endpointId
                    ) {

                        reverse.push(packet);

                        return;
                    }


                    /*
                    * -------------------------------------------------
                    * CASE 2
                    *
                    * Parent -> Child
                    *
                    * Example:
                    *
                    * Gateway -> PC
                    *
                    * -------------------------------------------------
                    */
                    if (
                        destinationDevice &&
                        destinationDevice.endpointId ===
                        childDevice.endpointId
                    ) {

                        forward.push(packet);

                        return;
                    }

                });


                return {
                    forward,
                    reverse
                };
            }

            function CurvedConnector({ children, width }) {

                const centerX = width / 2;

                return (
                    <svg
                        width={width}
                        height="70"
                        style={{
                            overflow: "visible",
                            display: "block"
                        }}
                    >

                        {
                            children.map((child, index) => {

                                const gap = width / children.length;
                                const x = gap * index + gap / 2;

                                const packetFlows =
                                    getLinkPacketFlows(child);

                                const forwardPackets =
                                    packetFlows.forward;

                                const reversePackets =
                                    packetFlows.reverse;

                                const forwardPath = `
                                    M ${centerX} 0
                                    L ${centerX} 20
                                    C ${centerX} 40,
                                    ${x} 40,
                                    ${x} 65
                                `;

                                const reversePath = `
                                    M ${x} 65
                                    C ${x} 40,
                                    ${centerX} 40,
                                    ${centerX} 20
                                    L ${centerX} 0
                                `;

                                return (
                                    <React.Fragment
                                        key={child.endpointId}
                                    >

                                        {/* Parent → Child link */}

                                        <path
                                            d={forwardPath}
                                            fill="none"
                                            stroke={getLinkColor(child)}
                                            strokeWidth="3"
                                        />

                                        {/* Child → Parent link */}

                                        {
                                            reversePackets.length > 0 && (
                                                <path
                                                    d={reversePath}
                                                    fill="none"
                                                    stroke={getLinkColor(child)}
                                                    strokeWidth="3"
                                                    opacity="0.45"
                                                />
                                            )
                                        }

                                        {/* Forward packets */}

                                        {
                                            forwardPackets.map(
                                                (packet, packetIndex) => (

                                                    <circle
                                                        key={
                                                            `forward-${animationCycle}-${child.endpointId}-${packet.id || packet.number}-${packetIndex}`
                                                        }
                                                        r="6"
                                                        opacity="0"
                                                        fill={getProtocolColor(packet.protocol)}
                                                        stroke="#FFFFFF"
                                                        strokeWidth="1"
                                                    >

                                                        <animateMotion
                                                            dur="1.8s"
                                                            begin={`${packetIndex * 0.35}s`}
                                                            repeatCount="1"
                                                            path={forwardPath}
                                                        />
                                                        <animate
                                                            attributeName="opacity"
                                                            values="0;1;1;0"
                                                            keyTimes="0;0.01;0.90;1"
                                                            dur="1.8s"
                                                            begin={`${packetIndex * 0.35}s`}
                                                            repeatCount="1"
                                                            fill="freeze"
                                                        />

                                                    </circle>

                                                )
                                            )
                                        }

                                        {/* Reverse packets */}

                                        {
                                            reversePackets.map(
                                                (packet, packetIndex) => (

                                                    <circle
                                                        key={
                                                            `reverse-${animationCycle}-${child.endpointId}-${packet.id || packet.number}-${packetIndex}`
                                                        }
                                                        r="6"
                                                        opacity="0"
                                                        fill={getProtocolColor(packet.protocol)}
                                                        stroke="#FFFFFF"
                                                        strokeWidth="1"
                                                    >
                                                        <animateMotion
                                                            dur="1.8s"
                                                            begin={`${packetIndex * 0.35}s`}
                                                            repeatCount="1"
                                                            path={reversePath}
                                                        />
                                                        <animate
                                                            attributeName="opacity"
                                                            values="0;1;1;0"
                                                            keyTimes="0;0.01;0.90;1"
                                                            dur="1.8s"
                                                            begin={`${packetIndex * 0.35}s`}
                                                            repeatCount="1"
                                                            fill="freeze"
                                                        />
                                                    </circle>

                                                )
                                            )
                                        }

                                    </React.Fragment>
                                );

                            })
                        }

                    </svg>
                );
            }

            function renderChildDevices(parentId) {

                const children = getChildren(parentId)
                    .sort(compareTopologyDevices);

                if (!children.length) return null;

                return (

                    <div
                        style={{
                            ...treeStyles.childrenContainer,

                            minWidth:
                                `${children.reduce(
                                    (total, child) => total + getBranchWidth(child.endpointId),
                                    0
                                ) + (children.length - 1) * NODE_GAP}px`
                        }}
                    >

                        <CurvedConnector
                            children={children}
                            width={
                                children.reduce(
                                    (total, child) =>
                                        total + getBranchWidth(child.endpointId),
                                    0
                                ) + (children.length - 1) * NODE_GAP
                            }
                        />

                        <div style={treeStyles.childNodes}>

                            {children.map(device => {

                                const linkColor = getLinkColor(device);

                                return (

                                    <div
                                        key={device.endpointId}
                                        style={treeStyles.nodeWrapper}
                                    >

                                        <div
                                            style={{
                                                position: "relative",
                                                width: "4px",
                                                height: "35px",
                                                background:
                                                    device.connectionType === "Wireless"
                                                        ? "repeating-linear-gradient(to bottom,#1565C0 0px,#1565C0 6px,transparent 6px,transparent 12px)"
                                                        : linkColor,
                                                overflow: "visible"
                                            }}
                                        >

                                            <div
                                                style={{
                                                    position: "relative",
                                                    width: "4px",
                                                    height: "35px",
                                                    background:
                                                        device.connectionType === "Wireless"
                                                            ? "repeating-linear-gradient(to bottom,#1565C0 0px,#1565C0 6px,transparent 6px,transparent 12px)"
                                                            : linkColor,
                                                    overflow: "visible"
                                                }}
                                            />

                                        </div>

                                        <div
                                            style={{
                                                fontSize: "11px",
                                                fontWeight: "700",
                                                color: "#1565C0",
                                                marginBottom: "3px"
                                            }}
                                        >
                                            {getInterfaceName(device)}
                                        </div>

                                        <LinkLabel
                                            text={getLinkLabel(device)}
                                            wireless={device.connectionType === "Wireless"}
                                        />
                                        <div
                                            style={{
                                                fontSize: "10px",
                                                color: "#666",
                                                marginBottom: "5px",
                                                maxWidth: "180px",
                                                textAlign: "center",
                                                lineHeight: "14px"
                                            }}
                                        >
                                            {getConnectionDescription(device)}
                                        </div>

                                        <div
                                            style={{
                                                fontSize: "11px",
                                                fontWeight: "700",
                                                color: getLinkQuality(device).color,
                                                marginBottom: "6px"
                                            }}
                                        >
                                            {getLinkQuality(device).text}
                                        </div>
                                        <div
                                            style={{
                                                fontSize: "10px",
                                                color: "#2E7D32",
                                                fontWeight: "700",
                                                marginBottom: "8px"
                                            }}
                                        >
                                            🔗 {
                                                device.linkSpeed ||
                                                device.portSpeed ||
                                                device.interfaceSpeed ||
                                                "-"
                                            }
                                        </div>

                                        <div
                                            style={{
                                                display: "flex",
                                                alignItems: "flex-start",
                                                justifyContent: "center",
                                                gap: "8px",
                                                position: "relative"
                                            }}
                                        >
                                            <NetworkNode
                                                icon={getDeviceIcon(device.deviceType)}
                                                title={device.hostname || device.ip}
                                                subtitle={device.ip}

                                                manufacturer={device.manufacturer}
                                                deviceType={device.deviceType}

                                                macAddress={device.mac}
                                                vendor={device.manufacturer}

                                                connectionType={device.connectionType}
                                                riskLevel={device.deviceRiskLevel}
                                                riskScore={device.deviceRiskScore}
                                                riskReason={
                                                    device.deviceRiskReasons?.[0]?.text ||
                                                    device.deviceRiskReasons?.[0] ||
                                                    "-"
                                                }

                                                status={device.active}

                                                parentName={device.parentHostname}
