                        headers={["Sl.", "Manufacturer", "Devices"]} rows={manufacturerRows} onClose={() => setShowManufacturer(false)} />
                    <ChartModal show={showChartModal} title={chartTitle} data={chartData} onClose={() => setShowChartModal(false)} />
                    <ChartModal show={showProtocolDistributionChart} title="📊 Protocol Distribution" data={protocolDistributionData} onClose={() => setShowProtocolDistributionChart(false)} />
                    <DashboardStatisticsModal show={showOperatingSystem} title="💻 Operating System Distribution"
                        headers={["Sl.", "Operating System", "Devices"]} rows={operatingSystemRows} onClose={() => setShowOperatingSystem(false)} />
                    <DashboardStatisticsModal show={showDiscovery} title="📡 Discovery Statistics"
                        headers={["Sl.", "Discovery Source", "Devices"]} rows={discoveryRows} onClose={() => setShowDiscovery(false)} />
                    <DashboardStatisticsModal show={showPorts} title="🔓 Open Port Statistics"
                        headers={["Sl.", "Port", "Devices"]} rows={portRows} onClose={() => setShowPorts(false)} />
                    <DashboardStatisticsModal show={showServices} title="⚙ Service Statistics"
                        headers={["Sl.", "Service", "Devices"]} rows={serviceRows} onClose={() => setShowServices(false)} />
                    <DashboardStatisticsModal show={showPerformance} title="📈 Performance Statistics"
                        headers={["Sl.", "Response Time", "Devices"]} rows={performanceRows} onClose={() => setShowPerformance(false)} />
                    <DashboardStatisticsModal show={showProtocols} title="🔗 Protocol Statistics"
                        headers={["Sl.", "Protocol", "Devices"]} rows={protocolRows} onClose={() => setShowProtocols(false)} />

                    <TopologyModal
                        show={showTopology}
                        topology={topologyData}
                        packets={packets}
                        animatedPacketIds={animatedPacketIds}
                        animationCycle={animationCycle}
                        loading={topologyLoading}
                        zoom={topologyZoom}
                        setZoom={setTopologyZoom}
                        onClose={() => setShowTopology(false)}

                        onNodeClick={(device) => setSelectedDevice(device)}
                        onDeviceDetails={(device) => setSelectedDevice(device)}

                        onSecurityAnalysis={(device) => {

                            setSelectedSecurityDevice(device);
                            setSecurityCorrelation(null);
                            setSecurityCorrelationError("");
                            setShowSecurityAnalysis(true);
                            loadSecurityCorrelation(device);
                        }}
                    />
                    <CommunicationMatrixModal
                        show={showCommunicationMatrix}
                        communications={communicationMatrix}
                        onClose={() => setShowCommunicationMatrix(false)}
                    />
                    <DeviceDetailsModal device={selectedDevice} deviceAIResult={deviceAIResult} deviceAILoading={deviceAILoading}
                        deviceAIError={deviceAIError} onAnalyzeDevice={analyzeDevice} onClose={() => setSelectedDevice(null)} />
                    <HistoricalTrendsModal show={showHistoricalTrends} loading={historicalTrendsLoading} error={historicalTrendsError} scans={historicalTrends}
                        onClose={() => setShowHistoricalTrends(false)} onLoadHistory={loadHistoricalTrends} page={historicalTrendsPage} pageSize={historicalTrendsPageSize}
                        total={historicalTrendsTotal} totalPages={historicalTrendsTotalPages} startDate={historicalTrendsStartDate} endDate={historicalTrendsEndDate} />
                    <BatchAIAnalysisModal show={showBatchAI} loading={batchAILoading} error={batchAIError} results={batchAIResults} stats={batchAIStats} onClose={() => setShowBatchAI(false)} />
                    <div style={{ padding: "4px 0" }}>
                        <hr className="divider" />
                    </div>
                    <div style={{ position: "relative" }}>
                        <h2 style={{ margin: 0, color: "#556B2F", padding: "8px 0" }}>Live Packet Capture</h2>

                        <AlertNotification
                            notification={notification}
                            onClose={() => setNotification(null)}
                        />

                        <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                            <input className="search-box" type="text" placeholder="Search Source / Destination / Protocol..." value={packetSearch}
                                onChange={(e) => setPacketSearch(e.target.value)} />

                            <div className="filter-group" style={{ marginLeft: "8px" }}>
                                <label className="filter-label">Transport :</label>
                                <select className="filter-dropdown" value={transportFilter} onChange={(e) => setTransportFilter(e.target.value)}>
                                    <option value="">Select</option>
                                    <option value="TCP">TCP</option>
                                    <option value="UDP">UDP</option>
                                    <option value="UNKNOWN">Unknown</option>
                                </select>
                            </div>
                            <div className="filter-group">
                                <label className="filter-label">Protocol :</label>
                                <select className="filter-dropdown" value={protocolFilter} onChange={(e) => setProtocolFilter(e.target.value)} disabled={!transportFilter}>
                                    <option value="">Select</option>
                                    {protocolOptions.map(protocol => (<option key={protocol} value={protocol}>{protocol}</option>))}
                                </select>
                            </div>
                            <button
                                type="button"
                                onClick={() => {
                                    const newState =
                                        !alertNotificationEnabled;

                                    setAlertNotificationEnabled(
                                        newState
                                    );

                                    /* Immediately close an active popup
                                       when notifications are turned OFF */
                                    if (!newState) {
                                        setNotification(null);
                                    }
                                }}
                                title={
                                    alertNotificationEnabled
                                        ? "Turn Alert Notifications OFF"
                                        : "Turn Alert Notifications ON"
                                }
                                aria-label={
                                    alertNotificationEnabled
                                        ? "Turn Alert Notifications OFF"
                                        : "Turn Alert Notifications ON"
                                }
                                style={{
                                    width: "44px",
                                    height: "44px",
                                    minWidth: "44px",
                                    borderRadius: "50%",
                                    border: "2px solid #556B2F",
                                    background:
                                        alertNotificationEnabled
                                            ? "#E8F5E9"
                                            : "#FFFFFF",
                                    color: "#556B2F",
                                    display: "flex",
                                    alignItems: "center",
                                    justifyContent: "center",
                                    cursor: "pointer",
                                    fontSize: "22px",
                                    padding: "0",
                                    marginLeft: "10px",
                                    boxSizing: "border-box"
                                }}
                            >
                                {alertNotificationEnabled
                                    ? "🔔"
                                    : "🔕"}
                            </button>
                        </div>
                        <p></p>
                        <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                            <button className="btn" onClick={loadTrafficVolume} style={{ minWidth: "190px" }}> 📈 Traffic Volume </button>
                            <button className="btn" onClick={loadTopTalkersPorts} style={{ marginLeft: "8px", minWidth: "210px" }}> 📡 Top Talkers / Ports </button>
                            <button className="btn"
                                onClick={async () => {
                                    if (!trafficAnalysis) {
                                        try {
                                            setTrafficLoading(true);

                                            const response = await fetch(
                                                CONFIG.API_BASE + "/traffic-analysis"
                                            );

                                            if (!response.ok) {
                                                throw new Error("Protocol Distribution Failed");
                                            }

                                            const data = await response.json();
                                            setTrafficAnalysis(data);
                                        } catch (error) {
                                            console.error(
                                                "Protocol Distribution Error:",
                                                error
                                            );

                                            alert(
                                                "Unable to load Protocol Distribution"
                                            );

                                            return;
                                        } finally {
                                            setTrafficLoading(false);
                                        }
                                    }

                                    setShowProtocolDistributionChart(true);
                                }}
                                style={{ marginLeft: "8px", minWidth: "230px" }}> 📊 Protocol Distribution </button>
                            <button className="btn" onClick={loadHistoricalTrends} style={{ marginLeft: "8px", minWidth: "190px" }}> 📈 Historical Trends </button>
                            {/*
                            <button className="btn" onClick={openHistoricalAnalysisControls} style={{ marginLeft: "8px", minWidth: "230px" }}> 🕒 Scheduled Historical Analysis </button>
                            {showHistoricalAnalysisControls && (
                                <div
                                    style={{
                                        flexBasis: "100%",
                                        margin: "15px 8px",
                                        padding: "16px",
                                        border: "1px solid #CCCCCC",
                                        borderRadius: "8px",
                                        background: "#FFFFFF",
                                        color: "#222222"
                                    }}
                                >
                                    <div style={styles.modalHeader}>
                                        <h3 style={{ margin: 0, color: "#556B2F" }}>
                                            Scheduled Historical Analysis
                                        </h3>

                                        <button
                                            className="btn"
                                            onClick={() =>
                                                setShowHistoricalAnalysisControls(false)
                                            }
                                        >
                                            Close
                                        </button>
                                    </div>

                                    <hr className="divider" />

                                    {historicalAnalysisError && (
                                        <p style={{ color: "#C62828" }}>
                                            {historicalAnalysisError}
                                        </p>
                                    )}

                                    {historicalAnalysisConfigError && (
                                        <p style={{ color: "#C62828" }}>
                                            {historicalAnalysisConfigError}
                                        </p>
                                    )}

                                    {historicalAnalysisResultError && (
                                        <p style={{ color: "#C62828" }}>
                                            {historicalAnalysisResultError}
                                        </p>
                                    )}

                                    {!historicalAnalysisConfig ? (
                                        <p>
                                            {historicalAnalysisConfigLoading
                                                ? "Loading schedule configuration..."
                                                : "Unable to load schedule configuration."}
                                        </p>
                                    ) : (
                                        <>
                                            <div style={{ marginBottom: "12px" }}>
                                                <label>
                                                    <input
                                                        type="checkbox"
                                                        checked={Boolean(
                                                            historicalAnalysisConfig.enabled
                                                        )}
                                                        disabled={historicalAnalysisLoading || historicalAnalysisConfigLoading || historicalAnalysisResultLoading}
                                                        onChange={event =>
                                                            setHistoricalAnalysisConfig(previous => ({
                                                                ...previous,
                                                                enabled: event.target.checked
                                                            }))
                                                        }
                                                    />{" "}
                                                    Enable scheduled historical analysis
                                                </label>
                                            </div>

                                            <div style={{ marginBottom: "12px" }}>
                                                <label>
                                                    Interval (minutes):{" "}
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        max="10080"
                                                        step="1"
                                                        value={
                                                            historicalAnalysisConfig.intervalMinutes ?? ""
                                                        }
                                                        disabled={historicalAnalysisLoading || historicalAnalysisConfigLoading || historicalAnalysisResultLoading}
                                                        onChange={event =>
                                                            setHistoricalAnalysisConfig(previous => ({
                                                                ...previous,
                                                                intervalMinutes: event.target.value
                                                            }))
                                                        }
                                                        style={{
                                                            width: "120px",
                                                            padding: "6px"
                                                        }}
                                                    />
                                                </label>
                                            </div>

                                            <button
                                                className="btn"
                                                disabled={historicalAnalysisLoading || historicalAnalysisConfigLoading || historicalAnalysisResultLoading}
                                                onClick={saveHistoricalAnalysisConfig}
                                            >
                                                {historicalAnalysisLoading
                                                    ? "Please wait..."
                                                    : "Save Schedule"}
                                            </button>

                                            <button
                                                className="btn"
                                                disabled={historicalAnalysisLoading || historicalAnalysisConfigLoading || historicalAnalysisResultLoading}
                                                onClick={async () => {
                                                    await Promise.all([
                                                        loadHistoricalAnalysisConfig(),
                                                        loadHistoricalAnalysisResult()
                                                    ]);
                                                }}
                                                style={{ marginLeft: "8px" }}
                                            >
                                                Refresh Status and Results
                                            </button>
                                        </>
                                    )}

                                    <hr className="divider" />

                                    <h4>Schedule Status</h4>

                                    {historicalAnalysisConfig ? (
                                        <div>
                                            <p>
                                                <b>Enabled:</b>{" "}
                                                {historicalAnalysisConfig.enabled ? "Yes" : "No"}
                                            </p>

                                            <p>
                                                <b>Schedule Type:</b>{" "}
                                                {historicalAnalysisConfig.scheduleType || "-"}
                                            </p>

                                            <p>
                                                <b>Interval:</b>{" "}
                                                {historicalAnalysisConfig.intervalMinutes ?? "-"} minutes
                                            </p>

                                            <p>
                                                <b>Last Run:</b>{" "}
                                                {historicalAnalysisConfig.lastRun
                                                    ? new Date(
                                                        historicalAnalysisConfig.lastRun
                                                    ).toLocaleString()
                                                    : "Not run yet"}
                                            </p>

                                            <p>
                                                <b>Next Run:</b>{" "}
                                                {historicalAnalysisConfig.nextRun
                                                    ? new Date(
                                                        historicalAnalysisConfig.nextRun
                                                    ).toLocaleString()
                                                    : "Not scheduled"}
                                            </p>
                                        </div>
                                    ) : (
                                        <p>Schedule status unavailable.</p>
                                    )}

                                    <hr className="divider" />

                                    <h4>Latest Analysis Result</h4>

                                    {historicalAnalysisResultLoading ? (
                                        <p>Loading analysis results...</p>
                                    ) : !historicalAnalysisResult ? (
                                        <p>No saved historical analysis results available yet.</p>
                                    ) : (
                                        <div>
                                            <p>
                                                <b>Generated At:</b>{" "}
                                                {historicalAnalysisResult.generatedAt
                                                    ? new Date(
                                                        historicalAnalysisResult.generatedAt
                                                    ).toLocaleString()
                                                    : "-"}
                                            </p>

                                            <p>
                                                <b>Scans Analysed:</b>{" "}
                                                {historicalAnalysisResult.scanCount ?? 0}
                                            </p>

                                            <p>
                                                <b>Traffic History Records:</b>{" "}
                                                {historicalAnalysisResult.trafficHistoryCount ?? 0}
                                            </p>

                                            <p>
                                                <b>Risk History Records:</b>{" "}
                                                {historicalAnalysisResult.riskHistoryCount ?? 0}
                                            </p>

                                            {[
                                                {
                                                    label: "Packet Trend",
                                                    key: "packetTrend"
                                                },
                                                {
                                                    label: "Traffic Volume Trend (Bytes)",
                                                    key: "byteTrend"
                                                },
                                                {
                                                    label: "Risk Score Trend",
                                                    key: "riskScoreTrend"
                                                }
                                            ].map(item => {
                                                const trend =
                                                    historicalAnalysisResult[item.key];

                                                const formatValue = value =>
                                                    value == null ||
                                                        !Number.isFinite(Number(value))
                                                        ? "-"
                                                        : Number(value).toLocaleString(
                                                            undefined,
                                                            {
                                                                maximumFractionDigits: 2
                                                            }
                                                        );

                                                return (
                                                    <div
                                                        key={item.key}
                                                        style={{ marginBottom: "12px" }}
                                                    >
                                                        <b>{item.label}:</b>{" "}
                                                        {formatValue(trend?.change)}

                                                        <div
                                                            style={{
                                                                fontSize: "13px",
                                                                color: "#555555"
                                                            }}
                                                        >
                                                            First: {formatValue(trend?.firstValue)}
                                                            {" | "}
                                                            Latest: {formatValue(trend?.latestValue)}
                                                            {" | "}
                                                            Change %:{" "}
                                                            {trend?.changePercent == null ||
                                                                !Number.isFinite(Number(trend.changePercent))
                                                                ? "-"
                                                                : `${Number(trend.changePercent).toFixed(2)}%`}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}*/}
                            <button className="btn" onClick={() => setShowTimeBasedTrends(true)} style={{ marginLeft: "8px", minWidth: "190px" }}> 📈 Time-based Trends </button>
                            <button className="btn" onClick={loadTrafficAnalysis} style={{ marginLeft: "8px", minWidth: "170px" }}> 📊 Traffic Analysis </button>
                            <button className="btn" onClick={loadRiskAnalysis} style={{ marginLeft: "8px", minWidth: "170px" }}> ⚠️ Risk Analysis </button>
                            <button className="btn"
                                onClick={() => {

                                    setAlertSeverityFilter("");
                                    setAlertTypeFilter("");
                                    setAlertStatusFilter("");

                                    setShowAlerts(true);

                                }}
                                style={{ marginLeft: "8px", minWidth: "150px" }}>🚨 Alerts
                                {
                                    alerts.filter(
                                        alert =>
                                            !alert.acknowledged
                                    ).length > 0
                                        ? ` (${alerts.filter(
                                            alert =>
                                                !alert.acknowledged
                                        ).length})`
                                        : ""
                                }
                            </button>
                            {/*
                        <button
                            className="btn"
                            onClick={() => {

                                try {

                                    if (!alertAudioContextRef.current) {

                                        alertAudioContextRef.current =
                                            new (
                                                window.AudioContext ||
                                                window.webkitAudioContext
                                            )();
                                    }

                                    alertAudioContextRef.current.resume();

                                    setAlertSoundEnabled(true);

                                } catch (error) {

                                    console.error(
                                        "Unable to enable alert sound:",
                                        error
                                    );

                                }

                            }}
                            style={{
                                marginLeft: "8px",
                                minWidth: "170px"
                            }}
                        >
                            {alertSoundEnabled
                                ? "🔊 Alert Sound ON"
                                : "🔇 Enable Alert Sound"}
                        </button>
                        */}
                        </div>
                        <p />
                        <div style={{
                            display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "10px", marginBottom: "10px",
                            fontWeight: "bold", flexWrap: "wrap"
                        }}>

                            <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                                <span>Packets Captured : {filteredPacketCount}</span>
                                <span>||</span>
                                <span>Packets Showing : {filteredPacketCount}</span>
                            </div>
                            <div className="packet-summary-group">
                                <span style={{ fontWeight: "bold" }}>Total : {packetSummary.total}</span>
                                {
                                    Object.entries(packetSummary.counts).map(([name, count]) =>
                                        <span key={name} style={{ color: getProtocolColor(name), fontWeight: "bold" }}>{name} : {count}</span>)
                                }
                            </div>
                        </div>
                        <div ref={packetTableRef} className="packet-table-container">
                            <PacketTable
                                filteredPackets={filteredPackets}
                                selectedPacket={selectedPacket}
                                setSelectedPacket={setSelectedPacket}
                                setSelectedWSPacket={setSelectedWSPacket}
                                setPacketAIResult={setPacketAIResult}
                                setPacketAIError={setPacketAIError}
                                setPacketAILoading={setPacketAILoading}
                            />
                        </div>
                    </div>
                    <div style={{ marginTop: "15px", padding: "15px", border: "1px solid #ddd", borderRadius: "6px", background: "#fafafa", display: "none" }}>
                        <h3 style={{ marginTop: 0 }}> Packet Details </h3>
                        {
                            selectedWSPacket ?
                                <div>
                                    <p><b>Time :</b> {selectedWSPacket.time}</p>
                                    <p><b>Interface :</b> {selectedWSPacket.interface}</p>
                                    <p><b>Source :</b> {selectedWSPacket.source}</p>
                                    <p><b>Destination :</b> {selectedWSPacket.destination}</p>
                                    <p><b>Protocol :</b> {selectedWSPacket.protocol}</p>
                                    <p><b>Length :</b> {selectedWSPacket.length} Bytes</p>
                                </div>
                                :
                                <div style={{ color: "#888" }}> Click a packet to view details. </div>
                        }
                    </div>
                    <hr />
                    <PacketDetailsModal
                        packet={selectedPacket} aiResult={packetAIResult} aiLoading={packetAILoading} aiError={packetAIError} onAnalyze={analyzePacket}
                        onDeepAnalysis={deepAnalyzePacket} onShowArchitecture={() => { setShowPacketArchitecture(true); }} onClose={() => setSelectedPacket(null)} />
                    <PacketArchitectureModal open={showPacketArchitecture} onClose={() => setShowPacketArchitecture(false)} />
                    <TrafficVolumeStatisticsModal show={showTrafficVolume} loading={trafficVolumeLoading} analysis={trafficAnalysis}
                        onClose={() => setShowTrafficVolume(false)} />
                    <TimeBasedTrendsModal show={showTimeBasedTrends} packets={packets} onClose={() => setShowTimeBasedTrends(false)} />
                    <TopTalkersPortsModal show={showTopTalkersPorts} loading={topTalkersPortsLoading} analysis={trafficAnalysis}
                        onClose={() => setShowTopTalkersPorts(false)} />
                    <HistoricalTrafficAnalysisModal show={showTrafficAnalysis} loading={trafficLoading} analysis={trafficAnalysis}
                        onClose={() => setShowTrafficAnalysis(false)}
                        onShowProtocolDistributionCharts={() => { setShowTrafficAnalysis(false); setShowProtocolDistributionChart(true); }} />
                    <SecurityAnalysisModal show={showSecurityAnalysis} device={selectedSecurityDevice} correlation={securityCorrelation}
                        correlationLoading={securityCorrelationLoading} correlationError={securityCorrelationError}
                        onGenerateReport={() => loadSecurityReport(selectedSecurityDevice)} securityReportLoading={securityReportLoading}
                        onClose={() => {
                            setShowSecurityAnalysis(false); setSelectedSecurityDevice(null); setSecurityCorrelation(null);
                            setSecurityCorrelationError("");
                        }} />
                    <SecurityReportModal show={showSecurityReport} report={securityReport} loading={securityReportLoading} error={securityReportError}
                        onClose={() => { setShowSecurityReport(false); setSecurityReport(null); setSecurityReportError(""); }} />
                    <RiskAnalysisModal show={showRiskAnalysis} analysis={riskAnalysis} onClose={() => setShowRiskAnalysis(false)} />

                    {
                        showAlerts && (
                            <AlertPanel
                                alerts={alerts}

                                alertSeverityFilter={
                                    alertSeverityFilter
                                }

                                setAlertSeverityFilter={
                                    setAlertSeverityFilter
                                }

                                alertTypeFilter={
                                    alertTypeFilter
                                }

                                setAlertTypeFilter={
                                    setAlertTypeFilter
                                }

                                alertStatusFilter={
                                    alertStatusFilter
                                }

                                setAlertStatusFilter={
                                    setAlertStatusFilter
                                }

                                alertLoading={
                                    alertLoading
                                }

                                onAcknowledge={
                                    acknowledgeAlert
                                }

                                onClear={
                                    clearAlerts
                                }

                                onViewPacket={(packetId) => {

                                    const packet =
                                        packets.find(
                                            item =>
                                                String(item.id) ===
                                                String(packetId)
                                        );

                                    if (packet) {

                                        setSelectedPacket(
                                            packet
                                        );

                                        setSelectedWSPacket(
                                            packet
                                        );

                                        setShowAlerts(
                                            false
                                        );
                                    }

                                }}

                                onClose={() =>
                                    setShowAlerts(false)
                                }
                            />
                        )
                    }
                    <DeepAnalysisModal style={{
                        position: "fixed", top: "50%", left: `calc(20% + ${PACKET_DETAILS_WIDTH / 2 + MODAL_GAP}px)`,
                        transform: "translateY(-90%)", width: `${DEEP_ANALYSIS_WIDTH}px`, height: "720px", background: "#FFFFFF", border: "1px solid #B5B5B5",
                        borderRadius: "10px", boxShadow: "0 18px 45px rgba(0,0,0,0.45)", zIndex: 10001, padding: "20px", overflowY: "auto"
                    }}
                        open={showDeepAnalysis} packet={selectedDeepPacket} result={deepAnalysisResult} loading={deepAnalysisLoading} error={deepAnalysisError}
                        onClose={() => { setShowDeepAnalysis(false); setSelectedDeepPacket(null); }} onShowArchitecture={() => setShowDeepArchitecture(true)} />
                    <DeepArchitectureModal open={showDeepArchitecture} onClose={() => setShowDeepArchitecture(false)} />
                    <SystemArchitectureModal open={showSystemArchitecture} onClose={() => setShowSystemArchitecture(false)} />
                    <FooterBar apiVersion={apiVersion} serverStatus={serverStatus} footerTime={footerTime} versionInfo={versionInfo} refreshInterval={CONFIG.FOOTER_REFRESH_INTERVAL} />
                    <hr />
                </div>

            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<DashUI />);

    </script>
</body>

</html>
